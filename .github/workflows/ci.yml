name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # a stuck step (an apt mirror hung for 17+ minutes on PR #3) fails the run instead of holding it for 6 hours
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rapid_medical
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rapid_medical
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # no apt at all: its mirrors hung the job twice on PR #3 (ubuntu-latest moved to Ubuntu 26). The tests need neither
      # psql (they use the site's driver) nor ffmpeg (video posters come from the media snapshot; without ffmpeg the site
      # simply skips them).
      - run: npm ci
      # dependencies that reach the site must audit clean; dev-only advisories are reviewed by hand (docs/memory/infrastructure.md)
      - run: npm audit --omit=dev --audit-level=moderate
      - run: cp .env.example .env && sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DATABASE_URL|; s|^AUTH_SECRET=.*|AUTH_SECRET=$AUTH_SECRET|" .env
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # the runner image already carries a browser's system libraries (Google Chrome is preinstalled): no --with-deps → no apt
      - run: npx playwright install chromium
        timeout-minutes: 10
      - name: e2e
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      # the last lines of the e2e log as an annotation: readable without signing in to GitHub
      - name: e2e log tail
        if: failure()
        shell: bash
        run: |
          tail -n 80 e2e.log | head -c 20000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/::/:%3A/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/^/::error title=e2e log tail::/'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }
