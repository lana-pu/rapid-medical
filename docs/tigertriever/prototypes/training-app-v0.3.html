const stages=['Device preparation','Positioning','Deployment','Optimising clot interaction','Aspiration & combination technique','Prepare to retrieve','Retrieval','Between passes'];
const cfg={'13-knob':{model:'Tigertriever 13',handle:'Precision-knob handle',kind:'knob'},'13-slider':{model:'Tigertriever 13',handle:'Legacy slider handle',kind:'slider'},'17-slider':{model:'Tigertriever 17',handle:'Legacy slider handle',kind:'slider'}};
const markets={us:{name:'US',knob:true},eu:{name:'Europe',knob:true},ap:{name:'Asia Pacific',knob:false,note:'The precision-knob handle is not offered in Asia Pacific. Tiger 13 has one handle here.'}};
const framing=[{id:'opening',name:'Opening',note:'Animation + data graphics'},{id:'closing',name:'Closing',note:'Mirrors the opening'}];
const sharedStages=[0,4,7];
function marketName(){return state.market?markets[state.market].name:'Market not chosen'}
function hasBefore(){return state.market==='eu'&&current()?.model==='Tigertriever 13'}
function knobAvailable(){return !!state.market&&markets[state.market].knob}
const state={page:'catalog',market:null,config:null,stage:0,compareStage:0,origin:null,drawer:false,query:'',focus:'a',bundle:'multi',showNotes:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function button(label,action,cls='',attrs=''){return `<button class="btn ${cls}" data-do="${action}" ${attrs}>${label}</button>`}
function current(){return cfg[state.config]}
function crumb(where){return `<div class="breadcrumbs"><button data-do="market">Programs</button>${state.market?`<span>/</span><button data-do="catalog">${esc(marketName())}</button>`:''}${state.page!=='catalog'?`<span>/</span><button data-do="overview">${current()?.model||'Course'}</button>`:''}${where?`<span>/</span><span>${esc(where)}</span>`:''}</div>`}
function header(){let c=current();return `<header class="top"><div class="brand"><div class="brandmark">RM</div><div><strong>Rapid Medical</strong><small>Interactive Training</small></div></div><span class="tag">UX concept · 0.3</span><div class="topcontext">${c?`<span class="ctxt"><strong>${esc(c.model)}</strong> · ${esc(c.handle)} · ${esc(marketName())}</span>`:`<span class="ctxt">${state.market?'Choose a device · '+esc(marketName()):'Choose your market'}</span>`}</div>${c?`<button class="headbtn" data-do="catalog">Change device</button>${state.page!=='compare'?'<button class="headbtn" data-do="quick">Find stage ⌕</button>':''}`:''}</header>`}
function note(){return `<div class="note"><strong>Design demonstration only.</strong> No medical instructions, video, warnings, clinical comparisons or market eligibility have been approved. All procedural content requires Rapid Medical source materials.</div>`}
function chooseMarket(){return `${crumb('')}<div class="intro"><div><div class="eyebrow">Training library</div><h1>Where do you practise?</h1><p>Training content, device availability and handle options differ by market. Choose yours first.</p></div></div>${note()}<div class="panel padded"><div class="eyebrow">Market</div><div class="optionrow" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${Object.entries(markets).map(([id,m])=>`<button class="option" data-do="pickmarket" data-m="${id}"><span><strong>${esc(m.name)}</strong><small>${m.knob?'Tiger 13: both handles':'Tiger 13: legacy slider only'}</small></span><span class="go">→</span></button>`).join('')}</div></div>`}
function choose(){if(!state.market)return chooseMarket();return `${crumb('')}<div class="intro"><div><div class="eyebrow">Training library · ${esc(marketName())}</div><h1>Choose your device</h1><p>Open training for a device you already know. This catalogue does not recommend a device or determine clinical applicability.</p></div></div>${note()}<div class="devicegroup"><section class="panel padded"><div class="productline"><div><div class="eyebrow">Model</div><h2>Tigertriever 13</h2><p>Select the handle version you want to learn.</p></div><div class="productsketch"><span></span></div></div><div class="optionrow">${knobAvailable()?`<button class="option" data-do="pick" data-cfg="13-knob"><span><strong>Precision-knob handle</strong><small>Training · 8 procedural stages</small></span><span class="go">→</span></button>`:`<div class="option unavailable"><span><strong>Precision-knob handle</strong><small>${esc(markets[state.market].note)}</small></span></div>`}<button class="option" data-do="pick" data-cfg="13-slider"><span><strong>Legacy slider handle</strong><small>Training · 8 procedural stages</small></span><span class="go">→</span></button></div></section><section class="panel padded"><div class="productline"><div><div class="eyebrow">Model</div><h2>Tigertriever 17</h2><p>Illustrative configuration in this demonstration.</p></div><div class="productsketch"><span></span></div></div><div style="margin-top:16px;max-width:390px"><button class="option" style="width:100%" data-do="pick" data-cfg="17-slider"><span><strong>Legacy slider handle</strong><small>Training · 8 procedural stages</small></span><span class="go">→</span></button></div></section><div class="panel padded"><strong>Other models</strong><p class="muted" style="margin:5px 0 0">Tigertriever 21 and 25 come in phase 2 of the content rollout and are not in this package yet. Tigertriever 17U: in the client's July list, not in the October one; to confirm.</p></div></div>`}
function framecard(id){const f=framing.find(x=>x.id===id);return `<button class="stagecard framing" data-do="framing" data-id="${id}"><b>${id==='opening'?'◦':'◦'}</b><span>${esc(f.name)}<small>${esc(f.note)}</small></span><i>›</i></button>`}
function controls(){return `<div class="controls" aria-label="Playback controls (demonstration)"><button class="headbtn" disabled>▷ Play</button><button class="headbtn" disabled>❚❚ Pause</button><button class="headbtn" disabled>↺ Replay</button><span>No narration. Read the text beside the clip.</span></div>`}
function beforeview(){let c=current();return `${crumb('Before you begin')}${note()}<div class="program"><div></div><div><div class="stageheading"><div><div class="eyebrow">Before you begin · ${esc(marketName())} · ${esc(c.model)}</div><h1>Anesthesia</h1><small>Shown only for this market and device</small></div></div><div class="textcontent panel"><h3>Guidance</h3><div class="placeholder"><strong>[Approved headline]</strong><ul class="bullets"><li>[Point 1 — client placeholder from the October wireframe]</li><li>[Point 2]</li></ul></div></div><div class="bottomnav">${button('← Overview','overview')}${button('Start training · Stage 1 →','start','primary')}</div></div></div>`}
function framingview(id){let c=current();const f=framing.find(x=>x.id===id);return `${crumb(f.name)}${note()}<div class="program"><div></div><div><div class="stageheading"><div><div class="eyebrow">${id==='opening'?'Before the stages':'After the stages'}</div><h1>${esc(f.name)}</h1><small>${esc(c.model)} · ${esc(c.handle)} · ${esc(marketName())}</small></div></div><div class="stagecontent"><div><div class="sectiontitle"><h2>Watch</h2><span class="topnote">Client asset pending</span></div><div class="visual"><span class="videotag">ANIMATION · CLIENT ASSET</span><div class="previewicon">▣</div><strong>Tigertriever animation</strong><small>Existing animation. No filming needed.</small></div>${controls()}<div class="graphics"><div class="graphic"><span class="videotag">DATA GRAPHIC</span><strong>${c.kind==='knob'?'DISTALS trial data':'TIGER trial data'}</strong><small>For the ${c.kind==='knob'?'precision-knob':'legacy'} handle group. Built from confirmed trial data.</small></div></div></div><div><div class="sectiontitle"><h2>Read alongside</h2></div><div class="textcontent panel"><h3>${id==='opening'?'What this programme covers':'What to take away'}</h3><div class="placeholder"><strong>[Approved headline]</strong><ul class="bullets"><li>[Point 1 — short, read while the animation plays]</li><li>[Point 2]</li></ul></div></div></div></div><div class="bottomnav">${id==='opening'?button('← Overview','overview')+button('Start training · Stage 1 →','start','primary'):button('← Stage 8','laststage')+button('Back to overview','overview','primary')}</div></div></div>`}
function quickcards(){return stages.map((s,i)=>`<button class="stagecard" data-do="stage" data-n="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(s)}</span><i>›</i></button>`).join('')}
function overview(){let c=current();return `${crumb('Course overview')}${note()}<div class="overviewtop"><section class="hero"><div class="eyebrow">Training programme · ${esc(marketName())}</div><h2>${esc(c.model)} — ${esc(c.handle)}</h2><div class="quickfacts"><span>Opening</span><span>8 procedural stages</span><span>Closing</span><span>Offline package</span></div><p>Go through the programme in sequence, or select the specific step you want to review. All medical material will be supplied and approved by Rapid Medical.</p>${hasBefore()?`<div class="beforebox"><div><div class="eyebrow">Before you begin · Anesthesia</div><strong>Guidance for Tigertriever 13 in Europe</strong><small>Shown only for this market and device. Client placeholder, content owner to confirm.</small></div>${button('Read first','before','sm')}</div>`:''}${button('Start training · Stage 1 →','start','primary')}</section><aside class="compareprompt"><div class="eyebrow">Understand the differences</div><h3>${c.model==='Tigertriever 13'?'Compare Tiger 13 handles':'Handle comparison'}</h3><p>${c.model==='Tigertriever 13'&&knobAvailable()?'Review the same procedural stage across legacy and precision-knob variants.':c.model==='Tigertriever 13'?esc(markets[state.market].note):'No approved handle-comparison pair is included for this demo configuration.'}</p>${button('Compare handles →','compare','',c.model==='Tigertriever 13'&&knobAvailable()?'':'disabled')}</aside></div><div class="sectiontitle"><h2>Programme</h2><span class="muted" style="font-size:12px">Select any section to open</span></div><div class="stageslist">${framecard('opening')}${quickcards()}${framecard('closing')}</div><div class="coursefoot"><span>Opening and Closing use the Tigertriever animation and data graphics, as in the client's July draft; the eight stages use short clips with on-screen text.</span></div>`}
function rail(){return `<nav class="rail panel" aria-label="Procedural stages"><p>Stages</p>${stages.map((n,i)=>`<button data-do="stage" data-n="${i}" class="${state.stage===i?'active':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(n)}</span></button>`).join('')}</nav>`}
function mediabox(handle,stage,side){let missing=stage===6 && handle==='knob' && side==='compare';return `<div class="visual ${missing?'missing':''}"><span class="videotag">VIDEO SLOT · CLIENT ASSET</span><div class="previewicon">${missing?'!':'▣'}</div><strong>${missing?'Media not provided':'Demonstration video'}</strong><small>${missing?'A source video is not available for this illustrative comparison. No substitution is made.':'Approved footage will appear here. No simulated clinical video or fabricated playback.'}</small></div>`}
function guidance(kind,i){const shared=sharedStages.includes(i);const hname=kind==='knob'?'Precision-knob handle':'Legacy slider handle';return `<div class="textcontent panel"><h3>On screen</h3><div class="placeholder"><strong>[Approved headline — one phrase]</strong><ul class="bullets"><li>[Point 1 — what to do, read while the clip plays]</li><li>[Point 2]</li><li>[Point 3]</li></ul></div>${shared?`<div class="handlenote same"><strong>Same for both handles</strong>This step does not differ between the legacy slider and the precision knob.</div>`:`<div class="handlenote"><strong>${esc(hname)}</strong><ul class="bullets"><li>[How this step differs with this handle]</li><li>[Second point, if any]</li></ul></div>`}<div class="warning"><strong>Important <span class="topnote">optional · not in the client's draft</span></strong>[Client-approved warning, if marketing wants one here]</div></div>`}
function stageview(){let c=current();let i=state.stage;return `${crumb('Stage '+(i+1))}${note()}<div class="program">${rail()}<div><div class="stageheading"><div><div class="eyebrow">Step ${String(i+1).padStart(2,'0')} of 08</div><h1>${esc(stages[i])}</h1><small>${esc(c.model)} · ${esc(c.handle)} · ${esc(marketName())}</small></div><div class="buttons">${button('Compare this step ↔','compare','',c.model==='Tigertriever 13'&&knobAvailable()?'':'disabled')}</div></div><div class="stagecontent"><div><div class="sectiontitle"><h2>Watch the demonstration</h2><span class="topnote">Client asset pending</span></div>${mediabox(c.kind,i,'stage')}${controls()}<div class="assetbar"><span>Short clip for this device, handle and stage.</span><span>Video placeholder</span></div></div><div><div class="sectiontitle"><h2>Read alongside</h2></div>${guidance(c.kind,i)}</div></div><div class="bottomnav">${i===0?button('← Opening','framingopen'):button('← Previous step','prev')}<span class="muted">${i+1} / 8</span>${i<7?button('Next step →','next','primary'):button('Closing →','framingclose','primary')}</div></div></div>`}
function difference(){return `<section class="difference panel"><header><h2>What should I compare at this step?</h2><span class="tag">Source differences pending</span></header><div class="differencegrid"><div class="rowlabel">Configuration</div><div>Legacy slider</div><div>Precision knob</div><div class="rowlabel">Stage guidance</div><div class="unapproved">[Client-approved differences]</div><div class="unapproved">[Client-approved differences]</div><div class="rowlabel">Media</div><div>Stage-specific video slot</div><div>Stage-specific video slot</div></div><p class="muted" style="font-size:12px;margin:11px 0 0">The comparison presents two approved source materials; it does not infer equivalence or generate clinical differences.</p></section>`}
function pair(which){let a=which==='a',handle=a?'slider':'knob';let label=a?'Legacy slider handle':'Precision-knob handle';return `<section class="paircol ${state.focus!==which?'mobileinactive':''}"><div class="comparehead"><b>${a?'A':'B'}</b><div><strong>${esc(label)}</strong><small>Tigertriever 13 · ${esc(marketName())}</small></div></div>${mediabox(handle,state.compareStage,'compare')}${guidance(handle,state.compareStage)}</section>`}
function compare(){if(current()?.model!=='Tigertriever 13'||!knobAvailable())return `${crumb('Compare')}${note()}<div class="empty panel"><h2>Comparison not available</h2><p>${current()?.model==='Tigertriever 13'&&!knobAvailable()?esc(markets[state.market].note)+' There is nothing to compare.':'No approved comparison pair is included for this illustrative configuration. The interface does not substitute another model or handle.'}</p>${button('Back to training','exitcompare','primary')}</div>`;let i=state.compareStage;return `${crumb('Compare handles')}${note()}<div class="intro"><div><div class="eyebrow">Comparison · Tigertriever 13</div><h1>Compare handles</h1><p>Two configurations, one selected procedural step. Review independently supplied material in matching positions.</p></div>${button('← Return to '+(state.origin?.page==='stage'?'step '+(state.origin.stage+1):'overview'),'exitcompare')}</div><div class="comparebar"><div class="eyebrow">Same procedural step on both sides</div><label><span class="sr">Choose comparison step</span><select id="comparestep">${stages.map((x,i)=>`<option value="${i}" ${i===state.compareStage?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x)}</option>`).join('')}</select></label></div>${difference()}<div class="mobiletabs"><button class="${state.focus==='a'?'active':''}" data-do="focus" data-side="a">A · Legacy slider</button><button class="${state.focus==='b'?'active':''}" data-do="focus" data-side="b">B · Precision knob</button></div><div class="pairgrid">${pair('a')}${pair('b')}</div><div class="bottomnav">${button('← Previous step','cprev','',i===0?'disabled':'')}<span class="muted">Step ${i+1} / 8</span>${button('Next step →','cnext','primary',i===7?'disabled':'')}</div>`}
function drawer(){let list=stages.map((x,i)=>({x,i})).filter(x=>x.x.toLowerCase().includes(state.query.toLowerCase())||String(x.i+1)===state.query.trim());return `<div class="drawerback" id="backdrop"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Find procedural stage"><div class="head"><div><div class="eyebrow">Within ${esc(current().model)}</div><h2>Find a stage</h2></div><button class="headbtn" data-do="close">Close ✕</button></div><p>Select a named stage to open it directly. You will stay in the same device and handle configuration.</p><label class="sr" for="query">Search stages</label><input autofocus id="query" type="search" placeholder="Search stage names or numbers…" value="${esc(state.query)}"><div class="resultlist" id="results">${list.map(({x,i})=>`<button data-do="stage" data-n="${i}"><b>${i+1}</b><span>${esc(x)}</span><span class="right">→</span></button>`).join('')||'<p>No matching stages.</p>'}</div><div class="noticefoot">Esc to close · Ctrl / Cmd + K to open</div></aside></div>`}
function footer(){return `<footer class="footer"><span>Rapid Medical UX concept · Not for clinical use · 2026</span><div><button data-do="notes">${state.showNotes?'Hide':'Show'} prototype scenarios</button></div></footer>${state.showNotes?`<div class="demooptions"><div><strong>Prototype scenarios</strong><br>Switch the sample bundle or start a task. These controls do not belong to the production interface.</div><div class="buttons"><button class="headbtn" data-do="reset">Multiple configurations</button><button class="headbtn" data-do="single">Single course</button><button class="headbtn" data-do="testcompare">Start at Stage 3 → Compare</button><button class="headbtn" data-do="apac">Asia Pacific · one handle</button></div></div>`:''}`}
function render(){let main=state.page==='catalog'?choose():state.page==='overview'?overview():state.page==='stage'?stageview():state.page==='before'?beforeview():state.page==='framing'?framingview(state.framing):compare();document.getElementById('app').innerHTML=header()+`<main class="wrap">${main}${footer()}</main>`+(state.drawer&&state.config?drawer():'');document.title='Rapid Medical — '+(state.page==='stage'?stages[state.stage]:state.page==='compare'?'Compare':state.page==='framing'?state.framing:'Training');if(state.drawer){const q=document.getElementById('query');q?.focus();q?.setSelectionRange(q.value.length,q.value.length)}}
function nav(p){state.page=p;state.drawer=false;render();window.scrollTo({top:0,behavior:'instant'})}
function enterStage(i){state.stage=Math.min(7,Math.max(0,i));nav('stage')}
function openCompare(){state.origin={page:state.page,stage:state.stage,config:state.config};state.compareStage=state.page==='stage'?state.stage:0;state.focus='a';nav('compare')}
function exitCompare(){let o=state.origin??{page:'overview',stage:0,config:state.config};state.config=o.config;state.stage=o.stage;nav(o.page==='stage'?'stage':'overview')}
function updateSearch(){let list=stages.map((x,i)=>({x,i})).filter(x=>x.x.toLowerCase().includes(state.query.toLowerCase())||String(x.i+1)===state.query.trim());document.getElementById('results').innerHTML=list.map(({x,i})=>`<button data-do="stage" data-n="${i}"><b>${i+1}</b><span>${esc(x)}</span><span class="right">→</span></button>`).join('')||'<p>No matching stages.</p>'}
document.addEventListener('click',e=>{const el=e.target.closest('[data-do]');if(!el){if(e.target.id==='backdrop'){state.drawer=false;render()}return}const a=el.dataset.do;if(a==='pick'){state.config=el.dataset.cfg;nav('overview')}else if(a==='pickmarket'){state.market=el.dataset.m;state.config=null;nav('catalog')}else if(a==='market'){state.market=null;state.config=null;nav('catalog')}else if(a==='before'){nav('before')}else if(a==='framing'){state.framing=el.dataset.id;nav('framing')}else if(a==='framingopen'){state.framing='opening';nav('framing')}else if(a==='framingclose'){state.framing='closing';nav('framing')}else if(a==='laststage'){enterStage(7)}else if(a==='catalog'){state.config=null;nav('catalog')}else if(a==='overview'){nav('overview')}else if(a==='start'){enterStage(0)}else if(a==='stage'){enterStage(Number(el.dataset.n))}else if(a==='next'){enterStage(state.stage+1)}else if(a==='prev'){enterStage(state.stage-1)}else if(a==='compare'){openCompare()}else if(a==='exitcompare'){exitCompare()}else if(a==='cnext'){state.compareStage=Math.min(7,state.compareStage+1);render()}else if(a==='cprev'){state.compareStage=Math.max(0,state.compareStage-1);render()}else if(a==='focus'){state.focus=el.dataset.side;render()}else if(a==='quick'&&state.config){state.drawer=true;state.query='';render()}else if(a==='close'){state.drawer=false;render()}else if(a==='notes'){state.showNotes=!state.showNotes;render()}else if(a==='reset'){state.market=null;state.config=null;state.showNotes=true;nav('catalog')}else if(a==='single'){state.market='eu';state.config='13-knob';state.showNotes=true;nav('overview')}else if(a==='testcompare'){state.market='eu';state.config='13-knob';state.stage=2;state.showNotes=false;state.page='stage';openCompare()}else if(a==='apac'){state.market='ap';state.config='13-slider';state.showNotes=true;nav('overview')}});
document.addEventListener('change',e=>{if(e.target.id==='comparestep'){state.compareStage=Number(e.target.value);render()}});document.addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;updateSearch()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){state.drawer=false;render()}if(state.config&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.drawer=!state.drawer;state.query='';render()}});
render();
</script></body></html>
