<div id="app"></div>
<script>
'use strict';
const STAGES=['Device preparation','Positioning','Deployment','Optimising clot interaction','Aspiration & combination technique','Prepare to retrieve','Retrieval','Between passes'];
const CONFIGS={
 't13-new':{model:'Tiger 13',handle:'Precision-knob handle',short:'New handle',variant:'New handle',product:'Tigertriever 13',group:'Tiger 13',pair:'t13-old'},
 't13-old':{model:'Tiger 13',handle:'Legacy slider handle',short:'Legacy handle',variant:'Legacy handle',product:'Tigertriever 13',group:'Tiger 13',pair:'t13-new'},
 't17-old':{model:'Tiger 17',handle:'Legacy slider handle',short:'Legacy handle',variant:'Legacy handle',product:'Tigertriever 17',group:'Tiger 17',pair:null}
};
const s={route:'catalog',scenario:'multi',market:'Demo market',config:'t13-new',hasSelection:false,stage:0,compareStage:0,compareOrigin:null,quick:false,quickSearch:'',play:{},readFrame:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(t,action,klass='',extra='')=>`<button type="button" class="btn ${klass}" data-action="${action}" ${extra}>${t}</button>`;
const context=()=>{let c=CONFIGS[s.config];return `<div class="context"><div class="ctxitems"><div><span class="field">DEMONSTRATION MARKET</span><span class="val">${esc(s.market)}</span></div><div><span class="field">DEVICE</span><span class="val">${c.product}</span></div><div><span class="field">HANDLE</span><span class="val">${c.handle}</span></div></div><span class="chip orange">Illustrative only · not approved</span></div>`};
function header(){return `<header class="top"><div class="brand"><div class="mark" aria-hidden="true">RM</div><div class="brandname"><strong>Rapid Medical</strong><span>Training App / UX concept 0.1</span></div></div><span class="chip dark">LOW-FIDELITY PROTOTYPE</span><div class="grow"></div><div class="topright"><label class="mini" for="scenario">Demo package</label><select class="devselect" id="scenario" aria-label="Choose demo package scenario"><option value="multi" ${s.scenario==='multi'?'selected':''}>Multiple configurations</option><option value="one" ${s.scenario==='one'?'selected':''}>Single course</option><option value="regions" ${s.scenario==='regions'?'selected':''}>Multiple markets</option></select>${btn('Reset','reset','small ghost')}</div></header>`}
function leftnav(){return `<nav class="nav" aria-label="Main navigation"><p class="navtitle">Training</p><button data-action="catalog" class="navbtn ${s.route==='catalog'?'active':''}"><span><span class="glyph">▦</span>Programs</span></button><button data-action="overview" class="navbtn ${s.route==='overview'?'active':''}" ${!s.hasSelection?'disabled title="Choose a training program first"':''}><span><span class="glyph">☰</span>Overview</span></button><button data-action="quick" class="navbtn" ${!s.hasSelection?'disabled title="Choose a training program first"':''}><span><span class="glyph">⌕</span>Quick reference</span><span class="tiny">⌘ K</span></button><button data-action="compare" class="navbtn ${s.route==='compare'?'active':''}" ${!s.hasSelection?'disabled title="Choose a training program first"':''}><span><span class="glyph">◧</span>Compare handles</span></button><p class="navtitle">Prototype</p><button data-action="test" class="navbtn ${s.route==='test'?'active':''}"><span><span class="glyph">◇</span>Test scenarios</span></button><button data-action="about" class="navbtn ${s.route==='about'?'active':''}"><span><span class="glyph">ⓘ</span>About this concept</span></button><div class="navbottom">Not for clinical use. All procedural text and video require Rapid Medical review and approval.</div></nav>`}
const notice=()=>`<div class="notice" role="note"><div class="noticemark">!</div><div><strong>UX prototype — demonstration content only</strong><p>Screen structure, interactions and device labels are illustrative. No medical instructions, warnings, market eligibility or media have been approved for use in this demo.</p></div></div>`;
const bread=(last)=>`<div class="breadcrumb"><button class="crumbbtn" data-action="catalog">Training</button><span>›</span>${s.route!=='catalog'?'<button class="crumbbtn" data-action="overview">Tigertriever 13</button><span>›</span>':''}<span class="current">${esc(last)}</span></div>`;
function catalog(){let visible=s.scenario==='regions' && s.market==='Market B' ? ['t17-old'] : ['t13-new','t13-old','t17-old'];let cards=visible.map(k=>{let c=CONFIGS[k];return `<button class="devicecard" data-action="config" data-config="${k}" aria-label="Open ${esc(c.product+' '+c.short)}"><div class="meta"><span class="chip">${esc(c.group)}</span><span class="chip outline">Demo configuration</span></div><h3>${c.product}</h3><p>${esc(c.handle)}<br><span class="tiny">8 procedural stages · illustrative course</span></p><span class="actionrow">Open training <span aria-hidden="true">↗</span></span></button>`}).join('');return `${bread('Programs')}${notice()}<div class="titleline"><div><p class="eyebrow">Training library</p><h1 class="h1">Choose a training program</h1><p class="sub">Select a known device configuration. This catalogue does not recommend a device or infer which products are clinically appropriate.</p></div>${btn('Find a stage','quick')}</div>${s.scenario==='regions'?`<div class="switchrow" aria-label="Illustrative market choice"><span class="mini">Demo market:</span><button class="switch ${s.market==='Market A'?'active':''}" data-action="market" data-market="Market A">Market A</button><button class="switch ${s.market==='Market B'?'active':''}" data-action="market" data-market="Market B">Market B</button><span class="tiny">Fictional groups; not real regulatory markets.</span></div>`:''}<div class="sectionhead"><h2>Programs in this example bundle</h2><span class="chip outline">${visible.length} selectable configurations</span></div><div class="cards">${cards}<div class="devicecard unavailable" aria-disabled="true"><div class="meta"><span class="chip">Roadmap</span></div><h3>Tiger 21 / 25</h3><p>Expansion discussed in the client's October wireframe. Not included in this prototype bundle.</p><span class="actionrow dim">Not in demo package</span></div></div><div class="blocknote">Adaptive entry hypothesis: a package with only one eligible course should open directly to its Overview; packages with multiple configurations use this catalogue. The behavior can be changed with the “Demo package” selector above.</div>`}
function stageMeta(i){if(i===6) return 'Illustrative missing-media state available in Compare';return i===0?'First procedural stage':'Open stage directly or in sequence'}
function overview(){let c=CONFIGS[s.config];return `${bread('Overview')}${notice()}${context()}<div class="titleline"><div><p class="eyebrow">Course overview</p><h1 class="h1">${c.model} training</h1><p class="sub">Eight procedural stages, with optional opening and closing materials. Start at the beginning or choose exactly the stage you need.</p></div><div class="actions">${btn('Start training →','start','primary')}${btn('Quick reference','quick')}${c.pair?btn('Compare handles','compare'):''}</div></div><div class="overviewgrid"><section class="panel panelpad"><div class="sectionhead"><h2>Procedural stages</h2><span class="chip outline">8 stages</span></div>${STAGES.map((name,i)=>`<div class="segmentrow"><span class="n">${i+1}</span><div class="segmain"><strong>${esc(name)}</strong><small>${esc(stageMeta(i))}</small></div><div class="segactions">${btn('Open →','stage','small',`data-stage="${i}"`)}</div></div>`).join('')}</section><aside><div class="panel panelpad"><div class="sectionhead"><h2>Program framing</h2></div><div class="frameitem"><span>○</span><div><strong>Opening</strong><br><small>Optional client-supplied introduction</small></div></div><div class="frameitem" style="margin-top:9px"><span>◎</span><div><strong>Closing</strong><br><small>Optional client-supplied recap</small></div></div><div class="blocknote">Opening and Closing are not additional procedural stages. Their presence and wording are controlled by the client-approved program.</div></div><div class="panel panelpad" style="margin-top:17px"><div class="sectionhead"><h2>Course details</h2></div><p class="tiny">Product family: Tigertriever</p><p class="tiny">Video format: client-supplied clips (none included here)</p><p class="tiny">Publication: demonstration, not a released package</p><p class="tiny">Regulatory scope: unverified</p></div></aside></div>`}
function index(){return `<aside class="stageindex" aria-label="Procedural stages"><p class="sectionlabel">Stages</p>${STAGES.map((n,i)=>`<button class="step ${s.stage===i?'active':''}" data-action="stage" data-stage="${i}" ${s.stage===i?'aria-current="step"':''}><span class="indexnum">${i+1}</span><span>${esc(n)}</span></button>`).join('')}</aside>`}
function getPlayer(key){return s.play[key]||{playing:false,progress:0};}
function media(key,variant,compact=false,missing=false){let p=getPlayer(key);return missing?`<div class="media missing ${compact?'compact':''}" role="status"><div class="missinglabel">Client-approved media not available in this demo<small>No clip substitution. This is a deliberate incomplete-content state.</small></div></div>`:`<div><div class="media ${compact?'compact':''}"><div class="screenlabel">VIDEO / VISUAL PLACEHOLDER</div><div class="devicegraphic" aria-hidden="true"></div><button class="playtarget" data-action="play" data-player="${key}">${p.playing?'Ⅱ Pause demo':'▷ Play demo'}</button><div class="mediahint">${esc(variant)} · no medical video included</div></div><div class="controlstrip"><button class="btn small" data-action="play" data-player="${key}" aria-label="${p.playing?'Pause':'Play'} demo playback">${p.playing?'Ⅱ':'▷'}</button><button class="btn small" data-action="replay" data-player="${key}" aria-label="Replay demo playback">↺</button><label class="sr" for="seek-${key}">Playback position</label><input id="seek-${key}" class="seek" data-player="${key}" type="range" min="0" max="100" value="${p.progress}" aria-label="Demo progress"><time data-time="${key}">${String(Math.floor(p.progress*30/100)).padStart(2,'0')}s / 30s</time></div></div>`}
function instructions(side='single'){return `<div class="panel instructions"><h3>On-screen guidance <span class="chip outline">To be supplied</span></h3><div class="placeholder">[Client-approved heading]<br>[Concise procedural text for this specific stage and configuration]<br>[Optional labels/captions referring to the corresponding media]</div><div class="callout"><strong>Required warning area — placeholder</strong>Client-approved safety statements and source/IFU metadata must be displayed here. No medical warning text has been fabricated.</div></div>`}
function stage(){let c=CONFIGS[s.config],i=s.stage;return `${bread('Stage '+(i+1))}${notice()}${context()}<div class="titleline"><div><p class="eyebrow">Procedural stage ${i+1} / 8</p><h1 class="h1">${esc(STAGES[i])}</h1><p class="sub">A media-first, learner-controlled stage view. The overview and Quick Reference reach the same content, with the same configuration context.</p></div><div class="actions">${btn('All stages','overview')}${btn('Quick reference','quick')}${c.pair?btn('Compare this stage →','compare','primary'):''}</div></div><div class="stagegrid">${index()}<div class="stagepanel"><div class="two"><div><div class="sectionhead"><h2>Demonstration</h2><span class="chip">${esc(c.short)}</span></div>${media('single',c.handle,false, s.config==='t13-new'&&i===6)}<div class="blocknote">Media controls simulate playback only. Production clips, captions and descriptive labels must be provided and approved by Rapid Medical.</div></div><div><div class="sectionhead"><h2>Instructions and context</h2></div>${instructions()}</div></div><div class="footnav">${btn('← '+(i===0?'Overview':'Previous stage'),i===0?'overview':'prev')}${btn(i===7?'Back to overview':'Next stage →',i===7?'overview':'next','primary')}</div></div></div>`}
function compare(){let c=CONFIGS[s.config],pair=c.pair;if(!pair)return `${bread('Compare')}${notice()}${context()}<div class="emptystate"><strong>No approved comparison pairing in this demonstration</strong><p>The currently selected configuration has no comparison target in this sample bundle. The tool does not infer matching devices or borrow media from another configuration.</p>${btn('Back to overview','overview','primary')}</div>`;
let left=CONFIGS['t13-old'],right=CONFIGS['t13-new'],missing=s.compareStage===6;return `${bread('Compare handles')}${notice()}<div class="titleline"><div><p class="eyebrow">Compare · Tiger 13</p><h1 class="h1">Compare handles</h1><p class="sub">Both configurations remain explicitly labeled. The selected procedural stage is shared; playback and source content remain independent.</p></div><div class="actions">${btn('← Exit comparison','exitcompare')}${btn('Quick reference','quick')}</div></div><div class="context"><div class="ctxitems"><div><span class="field">DEMO MARKET</span><span class="val">${esc(s.market)}</span></div><div><span class="field">PAIR</span><span class="val">Tiger 13 legacy ↔ Tiger 13 precision knob</span></div></div><span class="chip orange">Unapproved illustrative pairing</span></div><div class="sectionhead"><h2>Compare the same stage</h2><label class="mini" for="compstage">Stage <select class="comparestage" id="compstage">${STAGES.map((v,i)=>`<option value="${i}" ${i===s.compareStage?'selected':''}>${i+1}. ${esc(v)}</option>`).join('')}</select></label></div><div class="comparereview"><strong>What differs? <span class="chip outline">Client-authored content needed</span></strong><p>The example distinguishes the names of two handle mechanisms (legacy slider / precision knob). Procedural differences, directions and equivalence must be explicitly provided and approved by Rapid Medical.</p></div>${missing?`<div class="notice" role="status"><div class="noticemark">!</div><div><strong>Comparison unavailable for this stage</strong><p>Sample new-handle media is marked missing to demonstrate the blocking state. No legacy clip is reused as a replacement, and no equivalence is implied.</p></div></div>`:''}<div class="comparegrid"><section class="comparecol"><div class="comparetitle"><div><h3>Legacy handle</h3><small>${esc(left.handle)} · ${esc(s.market)}</small></div><span class="chip">A</span></div>${media('left',left.handle,true)}<div style="margin-top:14px">${instructions('left')}</div></section><section class="comparecol"><div class="comparetitle"><div><h3>New handle</h3><small>${esc(right.handle)} · ${esc(s.market)}</small></div><span class="chip">B</span></div>${media('right',right.handle,true,missing)}<div style="margin-top:14px">${instructions('right')}</div></section></div><div class="footnav">${btn('← '+(s.compareStage===0?'First stage':'Previous stage'), 'compareprev','',s.compareStage===0?'disabled':'')}${btn(s.compareStage===7?'Last stage':'Next stage →','comparenext','primary',s.compareStage===7?'disabled':'')}</div><div class="blocknote">Prototype hypothesis: desktop side-by-side; at narrow widths, stack the two complete panels. An A/B switching alternative remains untested and is not implemented here. No automatic video synchronization or calculated clinical differences.</div>`}
function test(){return `${bread('Test scenarios')}${notice()}<div class="titleline"><div><p class="eyebrow">Research handoff</p><h1 class="h1">Try three tasks</h1><p class="sub">A small set of complete journeys for formative review. Changing the preset resets navigation; the first prototype intentionally uses limited, synthetic content.</p></div></div><div class="scenario"><strong>Scenario 1 · First-time orientation</strong><p>Open a Tiger 13 training course, recognize the selected handle, start at Stage 1, advance and return to the overview.</p>${btn('Run orientation','runorient','primary')}</div><div class="scenario"><strong>Scenario 2 · Compare two handles</strong><p>From Stage 3 (Deployment), open Compare and check the same stage on two configurations. Switch to Stage 7 to inspect missing-media behavior, then exit comparison.</p>${btn('Run comparison','runcompare','primary')}</div><div class="scenario"><strong>Scenario 3 · Quick stage lookup</strong><p>Find “Retrieval” without following preceding stages. Return to the Overview and check context labels.</p>${btn('Run quick lookup','runquick','primary')}</div><div class="why"><h3>What to observe</h3><ul><li>Can the reviewer identify the current model and handle, without relying on color alone?</li><li>Does stage navigation preserve the selected configuration?</li><li>Does Exit Compare restore the origin, rather than redirecting to the catalogue?</li><li>Is an unavailable media pair interpreted as “not provided,” not “same procedure”?</li></ul></div>`}
function about(){return `${bread('Prototype notes')}${notice()}<div class="titleline"><div><p class="eyebrow">Scope and limitations</p><h1 class="h1">What this prototype tests</h1><p class="sub">A self-contained interactive low-fidelity UX artifact for design review, not a working medical education package.</p></div></div><div class="overviewgrid"><div class="panel panelpad"><h2>Included</h2><p>Adaptive course entry (single vs multi-configuration demo); configuration overview; eight procedural stages; Quick Reference as an overlay; independent simulated media controls; same-stage handle comparison; missing-content state; return-to-origin; narrow-screen stacking.</p><h2>Not yet included</h2><p>Client video/text, actual regulatory territory selection or approval logic, final copy/branding, interactive knob simulation, model-versus-model comparison, Content Studio prototype, offline package generator, authentic user testing.</p><div class="divider"></div><h2>Clinical safety boundary</h2><p>Model and handle names originate in client concept materials. The “Demo market” is fictional. The media and safety information are placeholders. The demonstration never claims a regulatory indication or clinical recommendation.</p></div><aside><div class="panel panelpad"><h2>Design evidence</h2><p class="tiny">Rapid Medical. Tigertriever Training Webpage Content Draft v0.10 (July 2026), FOR REVIEW.</p><p class="tiny">Rapid Medical. Tiger Device Stages HTML concept (October 2026).</p><p class="tiny">Rapid Medical UX Research. IA synthesis v0.4; JTBD Map v0.1; MVP Definition v0.7.</p><div class="blocknote">This is one original UX hypothesis. Workflow, comprehension and the comparison layout require later review with physicians; marketing can confirm factual content and operational constraints.</div></div></aside></div>`}
function quick(){return `<div class="quickdrawer" id="quickdrawer"><div class="quickinner" role="dialog" aria-modal="true" aria-labelledby="quicktitle"><button class="close" data-action="quickclose" aria-label="Close quick reference">✕</button><p class="eyebrow">Direct stage access</p><h2 id="quicktitle">Quick reference</h2><p class="sub" style="margin-bottom:18px">Jump to a known stage without walking through the course. The selected device and handle are preserved.</p><p class="tiny"><strong>${esc(CONFIGS[s.config].product)} · ${esc(CONFIGS[s.config].handle)}</strong></p><label class="sr" for="quicksearch">Search stages</label><input id="quicksearch" class="search" type="search" autocomplete="off" placeholder="Find a stage…" value="${esc(s.quickSearch)}"><div id="quicklist">${quickItems()}</div><div class="blocknote">This is quick access to the shared stage viewer — not a duplicate library or a separate mode with divergent content.</div></div></div>`}
function quickItems(){let filtered=STAGES.map((v,i)=>({v,i})).filter(({v})=>v.toLowerCase().includes(s.quickSearch.toLowerCase()));return filtered.length?filtered.map(({v,i})=>`<button class="quickitem" data-action="stage" data-stage="${i}"><span>${i+1}</span><div><strong>${esc(v)}</strong><small>Open directly in selected configuration</small></div><span style="margin-left:auto">→</span></button>`).join(''):'<p class="dim" style="margin-top:22px">No stage matches. Try a different term.</p>'}
function render(){let body= s.route==='catalog'?catalog():s.route==='overview'?overview():s.route==='stage'?stage():s.route==='compare'?compare():s.route==='test'?test():about();document.getElementById('app').innerHTML=header()+`<div class="shell">${leftnav()}<main class="main">${body}</main></div>`+(s.quick?quick():'');document.title='Rapid Medical | '+({catalog:'Programs',overview:'Overview',stage:'Stage '+(s.stage+1),compare:'Compare handles',test:'Test scenarios',about:'Prototype notes'}[s.route]);}
function resetPlay(){s.play={};}
function navigate(route){s.route=route;s.quick=false;resetPlay();render();window.scrollTo({top:0,behavior:'instant'});}
function gotoStage(i){s.stage=Math.max(0,Math.min(7,i));navigate('stage');}
function goCompare(){s.compareOrigin={route:s.route,stage:s.stage,config:s.config};s.compareStage=s.route==='stage'?s.stage:0;navigate('compare');}
function togglePlay(key,replay=false){let p=getPlayer(key);if(replay){s.play[key]={playing:true,progress:0}}else{s.play[key]={playing:!p.playing,progress:p.progress>=100?0:p.progress}};render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='reset'){s.scenario='multi';s.market='Demo market';s.config='t13-new';s.hasSelection=false;s.stage=0;s.compareOrigin=null;navigate('catalog')}
else if(a==='catalog'){navigate(s.scenario==='one'?'overview':'catalog')}
else if(a==='overview'){navigate('overview')}
else if(a==='quick'){s.quick=true;s.quickSearch='';render();const f=document.getElementById('quicksearch');if(f)f.focus()}
else if(a==='quickclose'){s.quick=false;render()}
else if(a==='config'){s.config=el.dataset.config;s.hasSelection=true;s.stage=0;navigate('overview')}
else if(a==='stage'){gotoStage(parseInt(el.dataset.stage,10))}
else if(a==='start'){gotoStage(0)}
else if(a==='next'){gotoStage(s.stage+1)}
else if(a==='prev'){gotoStage(s.stage-1)}
else if(a==='compare'){goCompare()}
else if(a==='exitcompare'){let origin=s.compareOrigin||{route:'overview',stage:0,config:s.config};s.config=origin.config;s.stage=origin.stage;navigate(origin.route==='stage'?'stage':'overview')}
else if(a==='compareprev'&&s.compareStage>0){s.compareStage--;resetPlay();render()}
else if(a==='comparenext'&&s.compareStage<7){s.compareStage++;resetPlay();render()}
else if(a==='market'){s.market=el.dataset.market;s.config=s.market==='Market B'?'t17-old':'t13-new';s.hasSelection=false;render()}
else if(a==='test'){navigate('test')}
else if(a==='about'){navigate('about')}
else if(a==='runorient'){s.config='t13-new';s.market='Demo market';s.scenario='multi';s.hasSelection=true;navigate('overview')}
else if(a==='runcompare'){s.config='t13-new';s.market='Demo market';s.scenario='multi';s.stage=2;s.hasSelection=true;navigate('stage')}
else if(a==='runquick'){s.config='t13-new';s.market='Demo market';s.scenario='multi';s.hasSelection=true;navigate('overview');s.quick=true;s.quickSearch='Retrieval';render()}
else if(a==='play'){togglePlay(el.dataset.player)}else if(a==='replay'){togglePlay(el.dataset.player,true)}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){s.scenario=e.target.value;s.market=s.scenario==='regions'?'Market A':'Demo market';s.config='t13-new';s.hasSelection=s.scenario==='one';s.stage=0;s.compareOrigin=null;navigate(s.scenario==='one'?'overview':'catalog')}
else if(e.target.id==='compstage'){s.compareStage=parseInt(e.target.value,10);resetPlay();render()}else if(e.target.classList.contains('seek')){let k=e.target.dataset.player;s.play[k]={playing:false,progress:Number(e.target.value)};render()}});
document.addEventListener('input',e=>{if(e.target.id==='quicksearch'){s.quickSearch=e.target.value;document.getElementById('quicklist').innerHTML=quickItems()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.quick){s.quick=false;render()}if(s.hasSelection&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();s.quick=!s.quick;s.quickSearch='';render();const f=document.getElementById('quicksearch');if(f)f.focus()}});
document.addEventListener('click',e=>{if(e.target.id==='quickdrawer'){s.quick=false;render()}});
setInterval(()=>{let changed=false;for(let key of Object.keys(s.play)){let p=s.play[key];if(!p.playing)continue;p.progress=Math.min(100,p.progress+1);changed=true;if(p.progress>=100)p.playing=false;const seeker=document.querySelector(`input.seek[data-player="${key}"]`);if(seeker){seeker.value=p.progress;const time=document.querySelector(`[data-time="${key}"]`);if(time)time.textContent=String(Math.floor(p.progress*30/100)).padStart(2,'0')+'s / 30s'} }if(changed){for(let b of document.querySelectorAll('[data-action="play"]')){let key=b.dataset.player; if(s.play[key])b.textContent=s.play[key].playing?(b.classList.contains('playtarget')?'Ⅱ Pause demo':'Ⅱ'):(b.classList.contains('playtarget')?'▷ Play demo':'▷')}}},300);
render();
</script></body></html>
