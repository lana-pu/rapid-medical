ную; этап входит в сравнение, если у обеих сторон есть урок с медиа. CX-05: сравнение не меняет основной контекст."}, {"type": "list", "items": ["Переключатель ручки есть только там, где у модели и рынка есть выбор: Tiger 13 вне Asia Pacific.", "Сравнение открывается на том же этапе, выход возвращает на исходный этап и конфигурацию.", "Рынок в сравнении для врача не меняется.", "Текст различий пишет только клиент."]}]}, {"type": "fold", "t": "7. Редактор видит влияние до правки", "blocks": [{"type": "text", "t": "**Явный выбор важнее скорости правки.** Лишний вопрос «где применить» дешевле, чем тихо изменённый урок другой конфигурации."}, {"type": "text", "t": "**Основание.** Работы E01, E02, E03; FS-09; инварианты безопасности admin-ux-content-workflows, раздел 7; spec: выбор «Only this lesson» или «Everywhere it's used»."}, {"type": "list", "items": ["Перед заменой общего медиа или текста видно, где ещё используется, и есть выбор: только здесь или везде (N).", "Ничего не распространяется само.", "Changes показывает рядом то, что в пакете, и черновик; изменённые поля подсвечены.", "Блокер публикации стоит у места, с действием рядом."]}]}, {"type": "fold", "t": "8. Пакет заморожен", "blocks": [{"type": "text", "t": "**Неизменность выпущенного важнее свежести.** Исправление уходит новым пакетом, а не правкой старого."}, {"type": "text", "t": "**Основание.** Работа E04; A-12; admin-ux-content-workflows, раздел 4: замена создаёт новую версию, а не перезапись. ADR-006: Publish = новый пакет. Spec → Пакет: неизменяемый."}, {"type": "list", "items": ["Save не меняет ни один пакет.", "Замена файла создаёт новую версию; старая остаётся для собранных пакетов.", "Каждый Publish создаёт пакет vN+1; прежние доступны и не меняются.", "Built и Sent различаются.", "Черновиков в пакете нет."]}]}, {"type": "claims", "items": [{"t": "Принципы 1–6 опираются на экраны аналогов, эвристику и замер своего прототипа; на врачах не проверены.", "label": "limit", "level": 2, "src": "benchmark.json; mobbin-flow-audit-v0.2.md"}, {"t": "Принципы 7–8 следуют из решений владелицы (ADR-006) и модели в spec.md; на редакторах клиента не проверены.", "label": "input", "level": 2, "src": "ADR-006; spec.md → Инструмент Tigertriever"}, {"t": "Режим показа не противоречит отказу от отдельных режимов: он меняет подачу того же урока, а не содержание.", "label": "inference", "level": 2, "src": "jtbd-map-v0.1.md, раздел 4; benchmark.json, выводы"}]}], "state": "filled"}], "card": {"why": "Описать, как это должно работать и чего мы сознательно не делаем. Это мост от исследования к экранам.", "input": ["JTBD, бенчмарк и паттерны"], "steps": ["Написать сценарии прозой по фазам", "Записать отвергнутые механики с причиной", "Сформулировать принципы: основание, правила, принцип"], "rules": ["Сценарии без раскладки экранов, со сбоями, выходом и возвратом", "Отвергнутое записываем, чтобы к нему не возвращаться", "У причины отказа есть основание", "Правила принципа проверяются на любом экране", "Принцип решает спор двух хороших вещей, а не звучит общо", "Рост не за счёт доверия"], "tools": ["/design-principles", "материал этапов 06–07"], "done": ["Сценарии по всем фазам", "Отвергнутые механики с причинами", "5–8 принципов с правилами", "Выводы для решения", "Владелец подтвердил этап"]}, "conclusions": ["**Все сценарии сходятся на одном экране этапа-плеере.** Он обслуживает сессию, самостоятельный повтор, сравнение ручек и предпросмотр редактора. Режим показа для представителя меняет подачу того же урока.", "**Самые дорогие ошибки: не та конфигурация и выведенное «одинаково».** Против них три принципа: метка контекста всегда видна, отсутствие показано честно, сравниваем только заведённые пары.", "**Studio проще, чем в раннем ресёрче.** Шага согласования нет (ADR-006); защиту дают показ влияния до правки и замороженный пакет.", "**Отложенное записано, а не потеряно.** Онлайн-версия для врача, ролик WhatsApp, интерактив кнопки и сравнение моделей ждут ответов SCOPE-04, SCOPE-03, SC en stage и Leave out", "content-studio-v0.1.html"], ["A-11", "Studio", "Публикация и выгрузка", {"t": "частично", "tone": "warn"}, "Состав, изменения, проверки, анимация сборки, статус Built. ZIP не собирается, Download выключен, контрольная сумма случайная", "content-studio-v0.1.html"], ["A-12", "Studio", "Замороженный состав пакета", {"t": "частично", "tone": "warn"}, "При сборке копируется снимок уроков. Версии медиа и manifest не фиксируются", "content-studio-v0.1.html"], ["A-13", "Studio", "История пакетов", {"t": "есть", "tone": "ok"}, "Packages: версия, дата, рынок, состав, размер, изменения, Built или Sent, Mark as sent", "content-studio-v0.1.html"], ["A-14", "Studio", "Подбор пар сравнения", {"t": "нет", "tone": "bad"}, "Пара выводится сама: Tiger 13 с обеими ручками на рынке. Можно только включить её в пакет или исключить", "content-studio-v0.1.html"], ["A-15", "Studio", "Матрица покрытия по рынкам", {"t": "частично", "tone": "warn"}, "Один рынок за раз через «Showing». Общей картины по рынкам нет", "content-studio-v0.1.html"], ["A-16", "Studio", "Роли и права", {"t": "нет", "tone": "bad"}, "Ролей нет, «admin» только в подписи кнопки", ""], ["A-17", "Studio", "Отзыв и замена разосланных пакетов", {"t": "нет", "tone": "bad"}, "Ни в одном прототипе", ""], ["A-18", "Studio", "Разница между пакетами", {"t": "частично", "tone": "warn"}, "У пакета хранится список изменений с прошлой версии. Построчного сравнения пакетов нет", "content-studio-v0.1.html"], ["A-19", "Studio", "Конструктор страниц", {"t": "нет", "tone": "bad"}, "Намеренно, вне объёма", ""], ["A-20", "Studio", "Добавить конфигурацию", {"t": "есть", "tone": "ok"}, "Модель с фазой, ручка по правилам рынка, дубль запрещён, новая колонка «Not started»", "content-studio-v0.1.html"], ["A-21", "Studio", "Готовность медиа и съёмка", {"t": "есть", "tone": "ok"}, "Статусы Confirmed, Review first, Filming needed с исполнителем, No filming. Фильтр и «Needs your attention»", "content-studio-v0.1.html"], ["X-01", сть), Opening, 8 процедурных этапов, Closing. Этап один и тот же для всех конфигураций.", "**Урок**: заголовок-фраза, 3–4 пункта рядом с клипом, пункты для конкретной ручки, медиа. Озвучки нет.", "**Сравнение**: две конфигурации на одном этапе рядом. Сходство не выводится, нет материала, так и написано.", "**Пакет**: замороженный ZIP для одного рынка. Publish собирает новый пакет, старые не меняются. Пакет сначала Built, после рассылки Sent.", "**Согласования нет** (ADR-006): кто работает с содержимым, тот и нажимает Publish. Кто именно, вопрос MED-08.", "**Содержимое и факты** (модели, ручки, рынки, видео, тексты, предупреждения) поставляет и отвечает за них Rapid Medical. Дизайн и устройство инструмента за нами."]}, {"type": "claims", "items": [{"t": "Кода инструмента нет. Есть учебные прототипы v0.1–v0.3, прототип Content Studio v0.1 и офлайн-тест S0.", "label": "fact", "level": 3, "src": "docs/spec.md → Инструмент Tigertriever; docs/tigertriever/prototypes/"}, {"t": "Инструмент бесплатный, раздаётся клиентам Rapid Medical.", "label": "input", "level": 2, "src": "docs/spec.md, решение владелицы 2026-11-08"}, {"t": "Сайт и инструмент в одном репозитории и с одной админкой: вход, затем выбор Website или Training tool.", "label": "input", "level": 2, "src": "docs/memory/decisions/ADR-005-one-repo-unified-admin.md"}, {"t": "Модели и фазы по вайрфрейму клиента: фаза 1 Tiger 13 и 17, фаза 2 Tiger 21 и 25. Новая ручка-кнопка только у Tiger 13 и не в Asia Pacific.", "label": "input", "level": 2, "src": "docs/memory/findings/client-brief-lesson-content.md"}]}], "state": "filled"}, {"key": "state", "title": "Состояние ресёрча", "hint": "Где знания много, где мало.", "blocks": [{"type": "text", "t": "Ресёрч почти весь кабинетный. Много знаем о том, что хочет клиент и как похожие задачи решают другие. Мало знаем о самих людях: врачи, представители и редакторы ни разу не опрошены и не наблюдались."}, {"type": "table", "head": ["Тема", "Сколько знаем", "На чём стоит", "Уровень"], "rows": [["Что клиент кладёт в урок, статусы медиа", {"t": "Много", "tone": "ok"}, "Черновик v0.10, вайрфрейм 14.10", {"level": 2}], ["Учебный UX у других продуктов", {"t": "Много", "tone": "ok"}, "Бенчмарк 10 продуктов, ранний платформенный бенчмарк", {"level": 2}], ["Редакторы контента и выпуски у других", {"t": "Много", "tone": "ok"}, "Документация шести CMS и Dozuki", {"level": 2}], ["Наука об обучении и сравнении", {"t": "Средне", "tone": "warn"}, "Мета-анализы и эксперименты; перенос на Tigertriever не проверен", {"level": 2}], ["Модели, ручки, рынки", {"t": "Средне", "tone": "warn"}, "Материалы клиента и публичные сайты; T17U и применимость по странам открыты", {"level": 2}], ["Офлайн-запуск на компьютерах клиента", {"t": "Мало", "tone": "warn"}, "Тест S0 на одном Маке", {"level": 3}], ["Кто правит и публикует", {"t": "Мало", "tone": "warn"}, "3–4 человека в админке (ADR-006); кто нажимает Publish, вопрос MED-08", {"level": 2}], ["Как врачи учатся новому устройству", {"t": "Почти нет", "tone": "bad"}, "Литература по другим устройствам, гипотезы JTBD", {"level": 1}], ["Как представитель проводит сессию", {"t": "Почти нет", "tone": "bad"}, "Гипотезы JTBD; на чём идёт сессия, вопрос встречи", {"level": 1}], ["Что именно заказано (Option #3)", {"t": "Почти нет", "tone": "bad"}, "Пересказ в реестре источников, оригинал не найден", {"level": 1}], ["Ограничения на промо-формулировки и предупреждения", {"t": "Почти нет", "tone": "bad"}, "Вопросы MED-04 и CR-03 к маркетингу", {"level": 1}]]}, {"type": "claims", "items": [{"t": "Ни одного вывода уровня L5: проверки на реальных врачах, представителях или редакторах не было. Сейчас доступен только маркетинг.", "label": "limit", "level": 3, "src": "docs/tigertriever/README.md; product/open-questions-register-v0.3.csv"}, {"t": "Все 63 вопроса в реестре открыты. Вопросы к маркетингу собраны во встречу 2026-11, дату назначает владелица.", "label": "fact", "level": 3, "src": "product/open-questions-register-v0.3.csv; docs/memory/BACKLOG.md"}, {"t": "Ранний ресёрч лежит в docs/tigertriever/research, в атлас он переносится по этапам.", "label": "fact", "level": 3, "src": "docs/research/project.json"}]}], "state": "filled"}, {"key": "levels", "title": "Уровни доказательности", "hint": "Шкала и как она применена.", "blocks": [{"type": "text", "t": "Шкала из `rules/evidence-levels.md` воркспейса. Уровень вывода по самому слабому звену. Работа агента уровень не поднимает. L1 не цитируем как факт и не ставим единственным основанием для P0."}, {"type": "table", "head": ["Уровень", "Что это", "Что у нас на этом уровне"], "rows": [[{"level": 1}, "Мнение, deep research без проверяемых источников, синтетика", "Платформенное исследование, JTBD, выводы о врачах из литературы, карта экранов, MVP v0.7"], [{"level": 2}, "Первичные источники, страницы вендоров, эвристический аудит, малые замеры", "Материалы клиента, сайты Rapid Medical, документация CMS, аудит Mobbin, бенчмарк"], [{"level": 3}, "Замер на своих данных", "Тест S0 на Маке, замеры экрана v0.3 в бенчмарке, сверка прототипов в инвентаре"], [{"level": 4}, "Внешние реальные данные в масштабе", "Нет"], [{"level": 5}, "Реальные целевые пользователи: интервью, анкета, пилот", "Нет. Первый шаг: задания из ux-flows v0.1 на 3–5 врачах или представителях"]]}, {"type": "sub", "t": "Метки раннего ресёрча и наш уровень"}, {"type": "table", "head": ["Метка в документах", "Что значит", "Наша метка", "Уровень"], "rows": [["C, CLIENT, INPUT", "Материалы клиента, не финальные", "Вводная проекта", {"level": 2}], ["R, PUBLISHED STUDY, M, E", "Рецензируемые исследования", "Внешний контекст; перенос на Tigertriever это вывод", {"level": 2}], ["O, SITE, FDA, P", "Наблюдение экрана, сайта, документа регулятора", "Внешний контекст", {"level": 2}], ["D, DESIGN, INFERENCE, H", "Наш синтез и компромиссы", "Вывод", {"level": 1}], ["T", "Техническое допущение", "Вывод до проверки; после S0 часть стала L3", {"level": 1}], ["OPEN", "Не решено источниками", "Вопрос", "нет уровня"]]}, {"type": "claims", "items": [{"t": "В раннем ресёрче своя система меток (C/R/O/P/D/T и SITE/FDA/DESIGN/OPEN). Она совместима со шкалой L1–L5 через таблицу выше; переписывать документы не нужно.", "label": "inference", "level": 3, "src": "research/final-desk-research-synthesis-v0.4.md §1.2; research/regional-product-research.md §0"}]}], "state": "filled"}, {"key": "library", "title": "Все исследования и замеры", "hint": "Карточка на исследование: метод, результаты, ограничения, выводы.", "blocks": [{"type": "text", "t": "18 исследований, замеров и рабочих документов по инструменту. Уровень у карточки по самому слабому звену её выводов. У документов решений и списков вопросов уровня нет. Заменённые документы помечены: читать их только вместе с тем, что их заменило."}, {"type": "stack", "t": "Карточки по уровню", "items": [{"t": "L1", "n": 7, "c": "l0"}, {"t": "L2", "n": 7, "c": "l2"}, {"t": "L3", "n": 1, "c": "l4"}, {"t": "без уровня", "n": 3, "c": "none"}]}, {"type": "cards", "placeholder": "Поиск по исследованиям", "items": [{"id": "platform", "t": "Платформенное исследование: паттерны, архитектура, MVP", "q": "Как устроить учебное приложение, админку и офлайн-сборку", "level": 1, "meta": ["2026-10-16", "docs/tigertriever/research/platform-research-full.md"], "tags": {"kind": "desk", "status": "replaced"}, "blocks": [{"type": "text", "t": "**Статус.** Заменено. Стек: ADR-005 (общий репозиторий и админка; замены пока нет, BACKLOG п. 6). Согласование и роли: ADR-006. Остальное: MVP v0.7, baseline v0.4, синтез v0.4."}, {"type": "text", "t": "**Метод.** Глубокий поиск по открытым источникам: учебные приложения (Touch Surgery, Incision, Thrombectomy EVT, EVT Navigator), редакторы контента, сравнение архитектур и способов офлайн-сборки. Больше 140 источников."}, {"type": "text", "t": "**Результаты.** Направление «Stage Player»: обзор из 8 этапов и пошаговый плеер с плашкой конфигурации. Стек: React, Supabase, Cloudflare R2, сборка ZIP в GitHub Actions. Модель контента: устройство × ручка × регион с белым списком применимости."}, {"type": "text", "t": "**Ограничения.** Часть меток «verified screenshot» подтверждена по подписи, а не по картинке. Названия этапов и формулировки условные. Написано до решения об общей админке."}, {"type": "text", "t": "**Выводы.** Идея Stage Player и модель контента перешли в baseline v0.4 и спеку. Стек и роли согласования не действуют."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/platform-research-full.md", "final": true}]}, {"id": "context", "t": "Контекст использования и учебный процесс", "q": "Кто, когда и в каких условиях учится по материалам Tigertriever", "level": 1, "meta": ["2026-10-17", "docs/tigertriever/research/context-of-use.md"], "tags": {"kind": "desk", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Кабинетный синтез: два материала клиента, прежние отчёты, рецензируемые исследования по обучению в тромбэктомии и других устройствах, руководство FDA по human factors. Не систематический обзор."}, {"type": "text", "t": "**Результаты.** Аудитория: врачи. Два способа: сессия с представителем и самостоятельный просмотр. 10 секций, короткий текст и клипы без озвучки, отдельный ролик для WhatsApp. Сравнение ручек требует парных материалов. Среда распространения не установлена."}, {"type": "text", "t": "**Ограничения.** Интервью нет. Исследования про другие устройства и группы, перенос на Tigertriever не доказан. Факты из брифа клиента это L2, выводы о врачах L1."}, {"type": "text", "t": "**Выводы.** Проверять на прототипе две потребности: знакомство с устройством и быстрый повтор одного этапа. 8 этапов и 10 секций совместимы."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/context-of-use.md", "final": true}]}, {"id": "regional", "t": "Региональные сайты, варианты устройства и рынки", "q": "Чем отличаются рынки и почему это не локализация", "level": 2, "meta": ["2026-10-17", "docs/tigertriever/research/regional-product-research.md"], "tags": {"kind": "desk", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Сравнение публичных сайтов Rapid Medical (US, международный, APAC) и сводок FDA 510(k). Метки: SITE, FDA, DESIGN, OPEN."}, {"type": "text", "t": "**Результаты.** Деление на рынки содержательное: разные страницы терапий, разные таблицы характеристик, на OUS отдельная страница MVO с Tiger 13. Публичные категории сайта не говорят о разрешении по странам."}, {"type": "text", "t": "**Ограничения.** Промо-страницы, не IFU. Состояние на 17.10.2026. Применимость по странам не проверена."}, {"type": "text", "t": "**Выводы.** В модели нужен отдельный справочник «рынок», не равный региону сайта. Факты о применимости даёт клиент."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/regional-product-research.md", "final": true}]}, {"id": "taxonomy", "t": "Таксономия контента и информационная архитектура", "q": "Какие типы материалов бывают у устройства", "level": 2, "meta": ["2026-10-17", "docs/tigertriever/research/content-taxonomy-ia.md"], "tags": {"kind": "desk", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Инвентарь структур на публичных сайтах Rapid Medical без переноса текстов. Метки: SITE, DESIGN, INPUT, OPTION."}, {"type": "text", "t": "**Результаты.** У устройства бывают обзор, схема, характеристики, объяснение механизма, кейсы и видео, исследования. Предложена минимальная архитектура: эти материалы в контексте урока, не отдельными деревьями."}, {"type": "text", "t": "**Ограничения.** Структура маркетингового сайта, не учебного продукта. Медицинские утверждения не проверялись."}, {"type": "text", "t": "**Выводы.** Дополнительные материалы (схема, характеристики, анимация, исследования) оставить необязательными. В инвентаре это L-15…L-18, сейчас их нет."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/content-taxonomy-ia.md", "final": true}]}, {"id": "learning", "t": "Обучение и сравнение: что говорит литература", "q": "Помогают ли сегменты, текст рядом с видео и сравнение", "level": 2, "meta": ["2026-10-17", "docs/tigertriever/research/learning-and-comparison.md"], "tags": {"kind": "desk", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Точечный поиск: мета-анализы по мультимедийному обучению, эксперимент с хирургическим видео, эксперимент по рентгенограммам, таксономии визуального сравнения, W3C. Предпочтение первоисточникам."}, {"type": "text", "t": "**Результаты.** Сегментация, сигналы и текст рядом с картинкой в среднем помогают. В хирургическом эксперименте пошаговое видео снизило ощущаемую нагрузку, но не улучшило результат. Сравнение выровненных объектов помогает заметить различия."}, {"type": "text", "t": "**Ограничения.** Общие выборки, не врачи с Tigertriever. Не систематический обзор. Оптимальное число сегментов и лучший вид сравнения не установлены."}, {"type": "text", "t": "**Выводы.** Индекс этапов, пауза и повтор, текст рядом с видео. Сравнение по смысловому этапу, плееры независимые. Вкладки A/B против двух колонок проверять на людях."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/learning-and-comparison.md", "final": true}]}, {"id": "admin", "t": "UX админки, редакторский процесс и офлайн-выпуск", "q": "Как маркетинг правит уроки и выпускает пакет", "level": 2, "meta": ["2026-11-02", "docs/tigertriever/research/admin-ux-content-workflows.md"], "tags": {"kind": "desk", "status": "partly"}, "blocks": [{"type": "text", "t": "**Статус.** Частично заменено: состояния Draft / Approved / Released, очередь ревью и шаг согласования отменены ADR-006."}, {"type": "text", "t": "**Метод.** Документация Dozuki, Directus, Payload, Storyblok, Strapi, Sanity, проверено 02.11.2026. Три сценария (замена видео, новая конфигурация, выпуск), три варианта архитектуры редактора, качественная таблица."}, {"type": "text", "t": "**Результаты.** Рекомендован редактор «от программы»: покрытие → урок → предпросмотр и сравнение с выпуском → центр выпуска. Предпросмотр тем же рендером, что у врача. Показывать, что затронет замена общего медиа. Выпуск замораживает состав."}, {"type": "text", "t": "**Ограничения.** Тестов с редакторами нет. Оценки трудоёмкости относительные."}, {"type": "text", "t": "**Выводы.** Легло в Content Studio v0.1: What's ready, Changes, Publish, Packages."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/admin-ux-content-workflows.md", "final": true}]}, {"id": "synthesis", "t": "Итоговый синтез кабинетного ресёрча v0.4", "q": "Что из раннего ресёрча считать рабочей базой", "level": 1, "meta": ["2026-11-02", "docs/tigertriever/research/final-desk-research-synthesis-v0.4.md"], "tags": {"kind": "desk", "status": "partly"}, "blocks": [{"type": "text", "t": "**Статус.** Частично заменено: шаг Approval в архитектуре редактора отменён ADR-006."}, {"type": "text", "t": "**Метод.** Сведение всех прежних отчётов, журнал противоречий, классы доказательств C, R, O, P, D, T. Выборочные источники перепроверены 02.11.2026."}, {"type": "text", "t": "**Результаты.** Путь врача: пакет → рынок и устройство, если нужно → обзор → плеер этапа ↔ сравнение. Редактор: покрытие → урок → проверка влияния → выпуск. Три ограничителя: содержание за Rapid Medical, никаких выводов о сходстве, замороженный пакет."}, {"type": "text", "t": "**Ограничения.** Нарративный синтез, не систематический обзор. Не каждое число из ранних отчётов перепроверено. Уровень по слабому звену: выводы о пользователях L1."}, {"type": "text", "t": "**Выводы.** Работающая база вместе с baseline v0.4; текущая модель живёт в спеке."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/final-desk-research-synthesis-v0.4.md", "final": true}]}, {"id": "jtbd", "t": "Карта JTBD v0.1", "q": "Какие работы у врача, представителя и редактора", "level": 1, "meta": ["2026-11-02", "docs/tigertriever/research/jtbd-map-v0.1.md"], "tags": {"kind": "desk", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Гипотезы работ в форме «Когда…, я хочу…, чтобы…» по материалам клиента, литературе и конкурентам. Ключи доказательств C, R, P, O, D, T."}, {"type": "text", "t": "**Результаты.** 19 работ: врач P01–P09, представитель R01–R04, редактор E01–E06. В приоритете P0: сориентироваться в конфигурации, понять, что меняет ручка, вернуться к этапу, сессия с представителем, доверие к применимости, рабочий офлайн-пакет, замена медиа с известным охватом, выпуск с прослеживаемостью."}, {"type": "text", "t": "**Ограничения.** Ни одного интервью. P0 значит «проверить первым», а не измеренная важность."}, {"type": "text", "t": "**Выводы.** Работы легли в 57 фич и в сценарий бенчмарка."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/research/jtbd-map-v0.1.md", "final": true}]}, {"id": "mobbin", "t": "Аудит прототипа v0.1 и паттерны Mobbin", "q": "Почему v0.1 перегружен и как выглядит v0.2", "level": 2, "meta": ["2026-11-05", "docs/tigertriever/design/mobbin-flow-audit-v0.2.md"], "tags": {"kind": "audit", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Эвристический аудит v0.1 по экранам, обзор паттернов Mobbin, ручная проверка v0.2 на 1365 и 390 px."}, {"type": "text", "t": "**Результаты.** Проблема v0.1 в иерархии: каркас приложения и дубли навигации. v0.2 упростил путь: устройство → ручка → обзор → этап → сравнение того же этапа → возврат. Все проверочные переходы v0.2 прошли, ошибок JS нет."}, {"type": "text", "t": "**Ограничения.** Примеры Mobbin общие, не медицинские; взаимодействия в них не проверены. Врачей нет."}, {"type": "text", "t": "**Выводы.** Путь v0.2 стал основой v0.3."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/design/mobbin-flow-audit-v0.2.md", "final": true}]}, {"id": "screenmap", "t": "Карта экранов врача v0.1", "q": "Какие экраны у врача и как они связаны", "level": 1, "meta": ["2026-11-05", "docs/tigertriever/design/screen-map-v0.1.md"], "tags": {"kind": "design", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Проектирование по черновику клиента, вайрфрейму 14.10 и синтезу v0.4. Схема переходов в mermaid."}, {"type": "text", "t": "**Результаты.** Адаптивный вход (одна конфигурация → сразу обзор), каталог с рынком, обзор, общий плеер этапа, оверлей быстрого перехода, сравнение в две колонки. Список намеренных исключений."}, {"type": "text", "t": "**Ограничения.** Всё это гипотезы дизайна, на людях не проверено."}, {"type": "text", "t": "**Выводы.** Прототипы v0.2 и v0.3 построены по этой карте, спека на неё ссылается."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/design/screen-map-v0.1.md", "final": true}]}, {"id": "flows", "t": "Сценарии врача и скрипт проверки v0.1", "q": "Какие задания дать на проверке прототипа", "level": 1, "meta": ["2026-11-05", "docs/tigertriever/design/ux-flows-v0.1.md"], "tags": {"kind": "design", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Описание сценариев F01–F03, альтернативных входов, эвристических критериев приёмки и скрипта проверки прототипа."}, {"type": "text", "t": "**Результаты.** F01 первое знакомство с устройством, F02 новая и старая ручка, F03 быстрый переход к этапу. Скрипт проверяет навигацию, не медицинские навыки."}, {"type": "text", "t": "**Ограничения.** Скрипт ни разу не прогоняли с людьми."}, {"type": "text", "t": "**Выводы.** Готовая основа для первой проверки на 3–5 врачах или представителях."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/design/ux-flows-v0.1.md", "final": true}]}, {"id": "baseline", "t": "Активная база продукта и UX v0.4", "q": "Что строим и кто за что отвечает", "level": null, "meta": ["2026-11-02", "docs/tigertriever/product/active-product-ux-baseline-v0.4.md"], "tags": {"kind": "product", "status": "partly"}, "blocks": [{"type": "text", "t": "**Статус.** Частично заменено: «approval» в редакторе отменено ADR-006; рынки и Before you begin уточнены в спеке 08.11."}, {"type": "text", "t": "**Метод.** Документ рабочих решений, не исследование."}, {"type": "text", "t": "**Результаты.** Врач: офлайн-пакет с конфигурациями, курсом и сравнением. Редактор: Content Studio с предпросмотром, проверкой влияния и выпуском. Модель: семейство → модель → вариант → конфигурация → программа → разделы → ревизии → замороженный манифест."}, {"type": "text", "t": "**Ограничения.** Медицинские факты не утверждены."}, {"type": "text", "t": "**Выводы.** Текущая модель перенесена в спеку и уточнена по материалам клиента."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/product/active-product-ux-baseline-v0.4.md", "final": true}]}, {"id": "mvp", "t": "Трассировка JTBD → фичи и определение MVP v0.7", "q": "Что входит в MVP и в каком порядке", "level": 1, "meta": ["2026-11-05", "docs/tigertriever/product/mvp-definition-v0.7.md"], "tags": {"kind": "product", "status": "partly"}, "blocks": [{"type": "text", "t": "**Статус.** Частично заменено: «явное согласование» в S3 отменено ADR-006."}, {"type": "text", "t": "**Метод.** Сопоставление 57 фич с 19 работами JTBD, разбиение на срезы S0–S4, спецификации FS-01…FS-17."}, {"type": "text", "t": "**Результаты.** Все 19 работ покрыты хотя бы одной фичей. Порядок: S0 технический тест, S1 учебный прототип, S2 прототип редактора, S3 рабочий MVP, S4 расширения."}, {"type": "text", "t": "**Ограничения.** Покрытие не доказывает ценность. Не подписанный объём и не оценка разработки."}, {"type": "text", "t": "**Выводы.** S0 сделан 08.11, S1 и S2 сделаны как прототипы v0.3 и Studio v0.1."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/product/mvp-definition-v0.7.md", "final": true}]}, {"id": "guide", "t": "Гайд встречи с маркетингом v0.6", "q": "Какие факты собрать у маркетинга", "level": null, "meta": ["2026-11-02", "docs/tigertriever/product/marketing-meeting-guide-v0.6.md"], "tags": {"kind": "questions", "status": "replaced"}, "blocks": [{"type": "text", "t": "**Статус.** Заменено: docs/meetings/marketing-meeting-2026-11.md."}, {"type": "text", "t": "**Метод.** Список вопросов 01–08 и далее с источниками в реестре вопросов."}, {"type": "text", "t": "**Результаты.** Первый выпуск, образец курса, готовность медиа, материалы для сравнения, кто правит и выпускает, распространение."}, {"type": "text", "t": "**Ограничения.** Только маркетинг как респондент. Вопросы о согласовании устарели после ADR-006."}, {"type": "text", "t": "**Выводы.** Вопросы перенесены в единый список встречи."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/product/marketing-meeting-guide-v0.6.md", "final": true}]}, {"id": "scope", "t": "Проверка объёма заказа v0.6.1", "q": "Что именно заказал клиент", "level": null, "meta": ["2026-11", "docs/tigertriever/product/marketing-scope-check-v0.6.1.md"], "tags": {"kind": "questions", "status": "replaced"}, "blocks": [{"type": "text", "t": "**Статус.** Заменено: docs/meetings/marketing-meeting-2026-11.md."}, {"type": "text", "t": "**Метод.** Дополнение к гайду: расхождения между черновиком клиента, вайрфреймом, Option #3 и списком фич."}, {"type": "text", "t": "**Результаты.** Вопросы SCOPE-01…SCOPE-09: интерактивная кнопка T13, Quick Reference, WhatsApp, онлайн-версия, модели и рынки, готовность медиа, Before you begin, целевые экраны, текст Option #3."}, {"type": "text", "t": "**Ограничения.** Ответов нет."}, {"type": "text", "t": "**Выводы.** Все вопросы SCOPE перенесены во встречу 2026-11."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/product/marketing-scope-check-v0.6.1.md", "final": true}]}, {"id": "brief", "t": "Что клиент сказал о содержимом урока", "q": "Что клиент сам кладёт в урок", "level": 2, "meta": ["2026-11-08", "docs/memory/findings/client-brief-lesson-content.md"], "tags": {"kind": "client", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Повторное чтение двух первичных файлов клиента: черновик v0.10 (июль 2026, 14 стр.) и вайрфрейм разработчика 14.10.2026. Переносили только структуру и статусы, без клинического текста."}, {"type": "text", "t": "**Результаты.** Секция: заголовок-фраза и 3–4 пункта, пункты по ручке или «All handles — same». Opening и Closing: анимация и графики данных по группе ручки. Статусы медиа: Confirmed, Review first, Filming needed, No filming. Клипы режутся из нескольких исходников. Блока предупреждений у клиента нет."}, {"type": "text", "t": "**Ограничения.** Черновик помечен FOR REVIEW. Письмо 22.09 и текст Option #3 не найдены."}, {"type": "text", "t": "**Выводы.** Отражено в спеке и в обоих прототипах 08.11."}, {"type": "link", "t": "Документ", "path": "docs/memory/findings/client-brief-lesson-content.md", "final": true}]}, {"id": "benchmark", "t": "Бенчмарк учебного UX", "q": "Как другие показывают пошаговое обучение", "level": 2, "meta": ["2026-11-08", "docs/research/stages/benchmark.json"], "tags": {"kind": "bench", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** 10 продуктов на одном пути врача из 6 шагов. Медицинские по экранам App Store, iFixit и v0.3 руками, бытовые аналоги по Mobbin."}, {"type": "text", "t": "**Результаты.** Экран этапа сделать плеером: медиа крупно, текст рядом без прокрутки. Переключать ручку на том же этапе. Режим показа для представителя. Одна навигация по этапам."}, {"type": "text", "t": "**Ограничения.** Экраны и эвристика, без врачей. Замеры v0.3 сделаны на двух размерах экрана."}, {"type": "text", "t": "**Выводы.** Вход для решения о v0.4 учебного прототипа. Этап атласа 07."}, {"type": "link", "t": "Документ", "path": "docs/research/stages/benchmark.json", "final": true}]}, {"id": "s0", "t": "Офлайн-тест S0", "q": "Открывается ли пакет с диска без сети", "level": 3, "meta": ["2026-11-08", "docs/tigertriever/spike-s0/README.md"], "tags": {"kind": "measure", "status": "current"}, "blocks": [{"type": "text", "t": "**Метод.** Пакет из одного этапа с двумя ручками и самопроверкой. Chrome for Testing 153 на macOS без интерфейса, ZIP распакован, сеть выключена."}, {"type": "text", "t": "**Результаты.** Оба видео играют, внешних запросов нет, самопроверка зелёная. Браузер не даёт читать файлы с диска через fetch, поэтому данные пакета лежат в content.js."}, {"type": "text", "t": "**Ограничения.** Один компьютер. Не проверены Windows, Edge, Firefox, Safari, больничные компьютеры, блокировка ZIP почтой и антивирусом."}, {"type": "text", "t": "**Выводы.** Контракт пакета работает на Маке. Настоящая проверка у клиента, вопрос T8 встречи."}, {"type": "link", "t": "Документ", "path": "docs/tigertriever/spike-s0/README.md", "final": true}]}], "filters": [{"key": "kind", "label": "Тип", "kind": "chips", "options": {"desk": "Кабинетное", "audit": "Аудит", "design": "Дизайн", "product": "Продукт", "questions": "Вопросы", "client": "Материалы клиента", "bench": "Бенчмарк", "measure": "Замер"}}, {"key": "status", "label": "Статус", "kind": "select", "options": {"current": "Действует", "partly": "Частично заменён", "replaced": "Заменён"}}]}], "state": "filled"}, {"key": "glossary", "title": "Термины", "hint": "Словарь проекта.", "blocks": [{"type": "table", "head": ["Термин", "Значение", "Где"], "rows": [["Инструмент", "Обучающий инструмент Tigertriever: офлайн-пакет для врача и Content Studio для маркетинга", "spec.md"], ["Tiger 13, 17, 17U, 21, 25", "Модели Tigertriever. Фаза 1: Tiger 13 и 17; фаза 2: Tiger 21 и 25. 17U есть в июльском списке клиента, в октябрьском нет (SCOPE-07)", "Вайрфрейм, черновик клиента"], ["Фаза выпуска", "Очередь, в которой клиент готовит контент по моделям. В вайрфрейме называется «Stage 1 / Stage 2», с этапом урока не путать", "Вайрфрейм 14.10"], ["Ручка", "Legacy slider: старая ручка-слайдер, у всех моделей. Precision knob: новая ручка-кнопка, только у Tiger 13", "Черновик клиента, спека"], ["Рынок", "US, Europe, Asia Pacific: справочник инструмента. Хранит, какие ручки доступны (в Asia Pacific кнопки нет)", "spec.md → Сущности"], ["Регион сайта", "/us, /ous, /apac в URL сайта (ADR-002). Отдельный справочник, с рынком инструмента не совпа   if (b.type === "claims") return `<div class="claims">${b.items.map(c => `<div class="claim"><div class="lab">${LABEL[c.label]}${level(c.level)}</div><div>${inline(c.t)}${c.src ? `<div class="src">${esc(c.src)}</div>` : ""}</div></div>`).join("")}</div>`;
  if (b.type === "link") {
    const body = `<span>${inline(b.t)}</span>${b.note ? `<small>${esc(b.note)}</small>` : ""}${b.path ? `<small class="code">${esc(b.path)}</small>` : ""}`;
    return b.url ? `<a class="linkrow" href="${safeUrl(b.url)}" target="_blank" rel="noopener">${body}</a>` : `<div class="linkrow">${body}</div>`;
  }
  return "";
}

function cardHtml(c){

function stage(s){ main.innerHTML = stageHtml(s); mount(); }
function stageHtml(s){
  const rest = s.todo.filter(t => t.kind === "question" || t.kind === "decision" || t.kind === "review");

}

function texts(b){
  if (b.type === "text" || b.type === "sub") return [b.t];
  if (b.type === "fold") return [b.t, ...b.blocks.flatMap(texts)];
  if (b.type === "list") return b.items;
  if (b.type === "shots") return b.items.map(i => i.cap || "");
  if (b.type === "prices") return b.rows.map(r => [r[0], r[3]].join(" · "));
  if (b.type === "stack") return [b.t, ...b.items.map(i => i.t)];
  if (b.type === "cards") return b.items.flatMap(c => [c.t, c.q || "", ...c.blocks.flatMap(texts)]);
  if (b.type === "prio") return b.rows.flatMap(r => [r.name, r.research || "", r.nowNote || "", r.why || "", detailText(b, r.id)]);
  if (b.type === "claims") return b.items.map(c => c.t);
  if (b.type === "link") return [[b.t, b.note].filter(Boolean).join(" · ")];
  if (b.type === "table") return b.rows.map(r => r.map(c => typeof c === "object" && c ? c.t ?? "" : c ?? "").join(" · "));
  return [];
}
const INDEX = STAGES.flatMap(s => [
  ...s.conclusions.map(t => ({s, where:"Выводы для решения", t})),
  ...s.outputs.flatMap(o => o.blocks.flatMap(b => texts(b).map(t => ({s, where:o.title, t})))),
  ...s.todo.filter(t => t.kind === "question" || t.kind === "decision").map(t => ({s, where:KIND[t.kind], t:t.t})),
]);
function search(term){
  const low = term.toLowerCase();
  const hits = INDEX.filter(x => x.t.toLowerCase().includes(low));
  const snip = t => {
    const plain = t.replace(/\*\*/g, ""), i = plain.toLowerCase().indexOf(low);
    const from = Math.max(0, i - 70), to = Math.min(plain.length, i + low.length + 110);
    return (from ? "…" : "") + esc(plain.slice(from, Math.max(i, from))) + (i < 0 ? esc(plain.slice(0, 180)) : `<mark>${esc(plain.slice(i, i + low.length))}</mark>` + esc(plain.slice(i + low.length, to))) + (to < plain.length ? "…" : "");
  };
  main.innerHTML = `<header><div class="eyebrow">Поиск</div><h1>«${esc(term)}»</h1><p class="lede muted">Найдено: ${hits.length}</p></header>
  <div>${hits.slice(0, 80).map(h => `<a class="hit" href="#s-${esc(h.s.id)}"><small>${esc(h.s.n)} ${esc(h.s.title)} · ${esc(h.where)}</small><span>${snip(h.t)}</span></a>`).join("")}</div>`;
}

function route(){
  const card = /^#c-(.+)$/.exec(location.hash);
  if (location.hash === "#all") return allView();
  const m = /^#s-(.+)$/.exec(location.hash);
  const owner = card && STAGES.find(x => x.outputs.some(o => o.blocks.some(b => b.type === "cards" && b.items.some(c => c.id === card[1]))));
  const s = owner || (m && STAGES.find(x => x.id === m[1]));
  renderNav(s ? s.id : null);
  q.value = "";
  if (card) { cState.q = ""; cState.sel = {}; cState.chips = {}; }
  s ? stage(s) : overview();
  if (card) return openCard(card[1]);
  window.scrollTo(0, 0);
}

/* таблица с фильтрами */
function applyTable(ctl){
  const ft = ctl.nextElementSibling, cols = {}, term = ctl.querySelector("[data-tq]").value.trim().toLowerCase();
  ctl.querySelectorAll("select").forEach(x => { if (x.value) cols[x.dataset.col] = new Set([x.value]); });
  ctl.querySelectorAll('.chip[aria-pressed="true"]').forEach(x => { (cols[x.dataset.col] ||= new Set()).add(x.dataset.v); });
  let shown = 0;
  const rows = ft.querySelectorAll("tr[data-row]");
  rows.forEach(tr => {
    const v = JSON.parse(tr.dataset.row);
    const ok = (!term || v.join(" ").toLowerCase().includes(term)) && Object.entries(cols).every(([c, set]) => set.has(v[c]));
    tr.hidden = !ok; if (ok) shown++;
  });
  ctl.querySelector("[data-tc]").textContent = `${shown} из ${rows.length}`;
}
main.addEventListener("input", e => { const c = e.target.closest(".ctl"); if (c && e.target.matches("[data-tq]")) applyTable(c); });
main.addEventListener("change", e => { const c = e.target.closest(".ctl"); if (c && e.target.matches("select[data-col]")) applyTable(c); });
main.addEventListener("click", e => {
  const b = e.target.closest(".chip[data-col]");
  if (b) { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); applyTable(b.closest(".ctl")); }
});

/* график цен и полосы */
function stack(b){
  const sum = b.items.reduce((n, i) => n + i.n, 0) || 1, col = c => ({ok:"var(--ok)", bad:"var(--bad)", warn:"var(--warn)", none:"var(--none)", accent:"var(--accent)", l0:"var(--l0)", l2:"var(--l2)", l4:"var(--l4)", sunk:"var(--sunk)"}[c]);
  return `<div class="stackbox"><h3>${esc(b.t)}</h3><div class="bar" role="img" aria-label="${esc(b.t)}">${b.items.map(i => `<i style="flex:${i.n} 0 0;background:${col(i.c)}" title="${esc(i.t)}: ${i.n} из ${sum}"></i>`).join("")}</div>
    <div class="lg">${b.items.map(i => `<span><i style="background:${col(i.c)}"></i>${esc(i.t)} <b>${i.n}</b></span>`).join("")}</div></div>`;

function priceChart(b){
  const rows = b.rows.slice().sort((x, y) => ((x[2] ?? x[1]) - (y[2] ?? y[1])));
  const W = 640, L = 110, R = 96, rowH = 26, top = 26, H = top + rows.length * rowH + 24;
  const max = Math.max(60, Math.ceil(Math.max(...rows.map(r => r[1] ?? r[2])) / 20) * 20), x = v => L + (W - L - R) * v / max;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.t || "Цены")}" style="font-family:var(--body)">`;
  if (b.band) g += `<rect x="${x(b.band[0])}" y="${top - 14}" width="${x(b.band[1]) - x(b.band[0])}" height="${rows.length * rowH + 8}" fill="var(--accent-soft)"/><text x="${(x(b.band[0]) + x(b.band[1])) / 2}" y="${top - 17}" text-anchor="middle" font-size="11" fill="var(--accent)">${esc(b.bandLabel || "")}</text>`;
  for (let t = 0; t <= max; t += max > 60 ? 20 : 10) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 8}" y2="${top + rows.length * rowH}" stroke="var(--line)" stroke-width="1"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">$${t}</text>`;
  rows.forEach((r, i) => {
    const [n, mon, ann, note] = r, y = top + i * rowH + 8;
    g += `<g><title>${esc(n)}: ${mon != null ? "$" + mon + " помесячно" : ""}${mon != null && ann != null ? ", " : ""}${ann != null ? "$" + ann + " в месяц при оплате за год" : ""}. ${esc(note)}</title><rect x="0" y="${y - 12}" width="${W}" height="${rowH}" fill="transparent"/>`;
    g += `<text x="${L - 10}" y="${y + 4}" text-anchor="end" font-size="12.5" fill="var(--fg)">${esc(n)}</text>`;
    if (mon != null && ann != null) g += `<line x1="${x(ann)}" x2="${x(mon)}" y1="${y}" y2="${y}" stroke="var(--l0)" stroke-width="2"/>`;
    if (ann != null) g += `<circle cx="${x(ann)}" cy="${y}" r="5" fill="var(--c-ann)" stroke="var(--surface)" stroke-width="2"/>`;
    if (mon != null) g += `<circle cx="${x(mon)}" cy="${y}" r="5" fill="var(--c-mon)" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<text x="${W - R + 12}" y="${y + 4}" font-size="11.5" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${mon != null ? "$" + mon : "—"} / ${ann != null ? "$" + ann : "—"}</text></g>`;
  });
  return `<div class="lg"><span><i style="background:var(--c-ann)"></i>${esc(b.annLabel || "за год")}</span><span><i style="background:var(--c-mon)"></i>${esc(b.monLabel || "помесячно")}</span></div><div class="tbl pchart">${g}</svg></div>`;
}

const refChips = ids => (ids || []).map(id => { const c = PB.refs[id]; if (!c) return ""; const lv = c[1]; return `<a class="ref" href="#c-${esc(id)}" title="${esc(c[0])}"><span class="lv ${lv ? "lv" + Number(lv) : "lvx"}">${lv ? "L" + Number(lv) : "—"}</span>${esc(c[0].length > 38 ? c[0].slice(0, 36) + "…" : c[0])}</a>`; }).join("");
function prioRow(r){
  const p = prioOf(r), PR = Object.fromEntries(PB.buckets.map(b => [b.key, b.label])), open = pOpen.has(r.id) || printAll;
  return `<tr>
    <td class="f" data-l="Фича"><div class="fname">${esc(r.name)}</div>${PB.details[r.id] ? `<button type="button" class="more" data-more="${esc(r.id)}" aria-expanded="${open}">${open ? "Свернуть" : "Подробнее"}</button>` : ""}<div class="meta"><span class="code">${esc(r.id)}</span>${jobChips(r.jobs)}<span>${esc(PB.areas[r.area] || "")}</span></div></td>
    <td class="nw" data-l="Сейчас"><span class="pill ${{have:"t-ok", part:"t-warn", broken:"t-bad", none:"t-none"}[r.now]}">${esc(ST[r.now])}</span><div class="note">${esc(r.nowNote || "")}</div></td>
    <td class="rs" data-l="Из ресёрча"><div>${esc(r.research || "")}</div>${(r.refs || []).length ? `<div class="refs">${refChips(r.refs)}</div>` : ""}</td>
    <td class="cm" data-l="Конкуренты"><span class="note">${esc(compOf(r))}</span></td>
    <td class="pr c-${esc(p)}" data-l="Приоритет"><select id="p-${esc(r.id)}" aria-label="Приоритет ${esc(r.name)}"${db && canWrite ? "" : " disabled"}>${Object.entries(PR).map(([k, v]) => `<option value="${esc(k)}"${k === p ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
      <div class="why">${esc(r.why || "")}</div>${r.decide ? `<span class="decide">${esc(PB.decideLabel)}</span>` : ""}
      ${p !== r.prio ? `<div class="changed">Изменено · было ${esc(PR[r.prio])}</div>` : ""}
      ${db && canWrite ? `<textarea id="n-${esc(r.id)}" rows="1" placeholder="Комментарий" aria-label="Комментарий к ${esc(r.name)}">${esc(noteOf(r))}</textarea>` : (noteOf(r) ? `<div class="note" style="margin-top:6px">${esc(noteOf(r))}</div>` : "")}
    </td></tr>${open ? prioDetail(r) : ""}`;
}
function prioList(){
  const t = pState.q.trim().toLowerCase();
  return PB.rows.filter(r => (!t || [r.name, r.research, r.nowNote, r.id, r.comp, detailText(PB, r.id)].join(" ").toLowerCase().includes(t))
    && (!pState.area || r.area === pState.area) && (!pState.st.size || pState.st.has(r.now))
    && (!pState.bucket || prioOf(r) === pState.bucket) && (!pState.only || isChanged(r)));
}
function renderPrioList(){
  const el = main.querySelector("[data-prio]"); if (!el) return;
  const counts = Object.fromEntries(prioKeys().map(k => [k, 0])); for (const r of PB.rows) counts[prioOf(r)]++;
  el.querySelector("#pbk").innerHTML = PB.buckets.map(b => `<button type="button" class="pb c-${esc(b.key)}" data-b="${esc(b.key)}" aria-pressed="${pState.bucket === b.key}"><b>${counts[b.key]}</b><strong>${esc(b.label)}</strong><span>${esc(b.short)}</span></button>`).join("");
  const list = prioList();
  el.querySelector("#pcnt").textContent = `${list.length} из ${PB.rows.length}`;
  el.querySelector("#psync").textContent = syncMsg;
  const groups = pState.group === "prio" ? PB.buckets.map(b => [b.label, list.filter(r => prioOf(r) === b.key), `c-${b.key}`]) : Object.keys(PB.areas).map(k => [PB.areas[k], list.filter(r => r.area === k), "c-p2"]);
  const head = `<thead><tr><th>Фича</th><th>Сейчас</th><th>Из ресёрча</th><th>Конкуренты</th><th>Приоритет</th></tr></thead>`;
  el.querySelector("#plist").innerHTML = list.length ? groups.filter(g => g[1].length).map(([t, rs, cls]) => `<section class="pgroup ${esc(cls)}"><div class="ph"><h2>${esc(t)}</h2><span class="tag">${rs.length}</span></div><div class="tbl"><table class="ptable">${head}<tbody>${rs.map(prioRow).join("")}</tbody></table></div></section>`).join("") : `<p class="empty">Ничего не найдено. Сбросьте фильтры или поиск.</p>`;
}
function mountPrio(el){
  el.innerHTML = `<div class="pbuckets" id="pbk" role="group" aria-label="Корзины приоритета"></div>
  <div class="ctl"><input type="search" id="pq" placeholder="Найти фичу" aria-label="Найти фичу" value="${esc(pState.q)}">
    <select id="parea" aria-label="${esc(PB.areaLabel)}"><option value="">${esc(PB.areaAll)}</option>${Object.entries(PB.areas).map(([k, v]) => `<option value="${esc(k)}"${pState.area === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
    <div class="chips" id="pst">${Object.entries(ST).map(([k, v]) => `<button type="button" class="chip" data-st="${k}" aria-pressed="${pState.st.has(k)}">${v}</button>`).join("")}</div>
    <select id="pgroup" aria-label="Группировать"><option value="prio">По приоритету</option><option value="area"${pState.group === "area" ? " selected" : ""}>По ${esc(PB.areaGroupBy)}</option></select>
    <button type="button" class="chip" id="ponly" aria-pressed="${pState.only}">Только изменённые</button>
    <button type="button" class="chip" id="pall">Раскрыть все</button><span class="cnt" id="pcnt"></span></div>
  <div class="note" id="psync"></div><div id="plist" style="display:grid;gap:22px"></div>`;
  renderPrioList();
  el.addEventListener("input", e => { if (e.target.id === "pq") { pState.q = e.target.value; renderPrioList(); } });
  el.addEventListener("change", e => {
    if (e.target.id === "parea") { pState.area = e.target.value; renderPrioList(); }
    else if (e.target.id === "pgroup") { pState.group = e.target.value; renderPrioList(); }
    else if (e.target.matches("select[id^='p-']")) savePrio(e.target.id.slice(2), {p: e.target.value});
  });
  el.addEventListener("focusout", e => {
    const t = e.target; if (!t.matches("textarea[id^='n-']")) return;
    const id = t.id.slice(2); if ((t.value || "") !== ((over[id] && over[id].note) || "")) savePrio(id, {note: t.value.trim()});
  });
  el.addEventListener("click", e => {
    const m = e.target.closest("[data-more]"), b = e.target.closest("[data-b]"), st = e.target.closest("[data-st]");
    if (m) { const id = m.dataset.more; pOpen.has(id) ? pOpen.delete(id) : pOpen.add(id); renderPrioList(); }
    else if (b) { pState.bucket = pState.bucket === b.dataset.b ? "" : b.dataset.b; renderPrioList(); }
    else if (st) { const k = st.dataset.st; pState.st.has(k) ? pState.st.delete(k) : pState.st.add(k); st.setAttribute("aria-pressed", pState.st.has(k)); renderPrioList(); }
    else if (e.target.id === "ponly") { pState.only = !pState.only; e.target.setAttribute("aria-pressed", pState.only); renderPrioList(); }
    else if (e.target.id === "pall") { const all = prioList().filter(r => PB.details[r.id]), closed = all.some(r => !pOpen.has(r.id)); for (const r of all) closed ? pOpen.add(r.id) : pOpen.delete(r.id); e.target.textContent = closed ? "Свернуть все" : "Раскрыть все"; renderPrioList(); }
  });
}
async function savePrio(id, patch){
  const r = PB.rows.find(x => x.id === id); if (!r || !db) return;
  const cur = over[id] || {};
  const next = {p: okP(patch.p) ?? okP(cur.p) ?? r.prio, note: patch.note ?? cur.note ?? "", at: Date.now()};
  over[id] = next; renderPrioList();
  try { await db.collection(PB.collection).doc(id).set(next); syncMsg = "Сохранено."; }
  catch (err) {
    if (err && err.code === "invalid_argument") { canWrite = false; syncMsg = "У вас нет права менять приоритеты, таблица только для чтения."; }
    else syncMsg = "Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.";
  }
  renderPrioList();
}
async function connectPrio(){
  if (!PB) return;
  const cl = window.claude;
  db = cl && cl.use ? await cl.use("db") : null;
  if (!db) { syncMsg = "Приоритеты показаны из файла. Менять их можно в опубликованной странице."; renderPrioList(); return; }
  const user = await cl.use("user");
  const can = user && user.can ? await user.can("data.write") : null;
  canWrite = can !== false;
  let first = true;
  const timer = setTimeout(() => { if (first) { syncMsg = "База пока не отвечает, показаны приоритеты из файла."; renderPrioList(); } }, 10000);
  db.collection(PB.collection).onSnapshot(snap => {
    const ids = new Set(PB.rows.map(r => r.id));
    for (const k of Object.keys(over)) delete over[k];
    for (const d of snap.docs) { if (!ids.has(d.id)) continue; const v = d.data() || {}, p = okP(v.p), note = typeof v.note === "string" ? v.note.slice(0, 2000) : ""; if (p || note) over[d.id] = {p, note}; }
    if (!snap.metadata || !snap.metadata.fromCache) { first = false; clearTimeout(timer); }
    const n = Object.keys(over).length;
    syncMsg = canWrite ? (n ? `Изменённых строк: ${n}. Меняйте приоритет в строке, сохраняется сразу.` : "Меняйте приоритет в строке, сохраняется сразу для всех.") : "Таблица только для чтения.";
    const a = document.activeElement; if (!(a && a.id && a.id.startsWith("n-"))) renderPrioList();
  }, () => { clearTimeout(timer); syncMsg = "Не удалось загрузить сохранённые приоритеты, показаны приоритеты из файла."; canWrite = false; renderPrioList(); });
}
function mount(){
  const c = main.querySelectorAll("[data-cards]"); c.forEach(mountCards);
  const p = main.querySelectorAll("[data-prio]"); p.forEach(mountPrio);
}

/* экран крупно */
const lb = document.getElementById("lb");

/* Markdown и PDF */
function mdCell(c){ return String(typeof c === "object" && c ? (c.level ? "L" + c.level : c.t ?? "") : c ?? "").replace(/\|/g, "\\|").replace(/\n/g, " "); }
function mdBlock(b, o){
  if (b.type === "text") o.push(b.t, "");
  else if (b.type === "sub") o.push("#### " + b.t, "");
  else if (b.type === "list") o.push(...b.items.map(i => "- " + i), "");
  else if (b.type === "claims") o.push(...b.items.map(c => `- *${LABEL[c.label]}${c.level ? " · L" + c.level : ""}.* ${c.t}${c.src ? ` (${c.src})` : ""}`), "");
  else if (b.type === "table") o.push("| " + b.head.join(" | ") + " |", "|" + " --- |".repeat(b.head.length), ...b.rows.map(r => "| " + r.map(mdCell).join(" | ") + " |"), "");
  else if (b.type === "link") o.push(`- ${b.t}${b.url ? " — " + b.url : ""}${b.path ? " — " + b.path : ""}`, "");
  else if (b.type === "fold") { o.push("#### " + b.t, ""); b.blocks.forEach(x => mdBlock(x, o)); }
  else if (b.type === "shots") o.push(...b.items.map((i, n) => `${n + 1}. ${i.cap || ""}`), "");
  else if (b.type === "stack") o.push(`**${b.t}:** ` + b.items.map(i => `${i.t} ${i.n}`).join(" · "), "");
  else if (b.type === "prices") o.push("| Продукт | Помесячно | За год, в месяц | Оговорки |", "| --- | --- | --- | --- |", ...b.rows.map(r => `| ${r[0]} | ${r[1] ?? "—"} | ${r[2] ?? "—"} | ${r[3]} |`), "");
  else if (b.type === "cards") b.items.forEach(c => { o.push(`#### ${c.level ? "[L" + c.level + "] " : ""}${c.t}`, ""); if (c.q) o.push(c.q, ""); c.blocks.forEach(x => mdBlock(x, o)); });
  else if (b.type === "prio") {
    for (const k of b.buckets) {
      const rs = b.rows.filter(r => prioOf(r) === k.key); if (!rs.length) continue;
      o.push(`#### ${k.label} · ${rs.length}`, "");
      for (const r of rs) {
        o.push(`**${r.id} · ${r.name}.** Сейчас: ${ST[r.now]}. ${r.nowNote || ""} Ресёрч: ${r.research || "—"} Почему: ${r.why || "—"}${noteOf(r) ? " Комментарий: " + noteOf(r) : ""}`, "");
        const d = b.details[r.id]; if (!d) continue;
        o.push(d.what, "");
        for (const c of d.competitors || []) o.push(`- **${c.name}.** ${c.how}${c.take ? " Взять: " + c.take : ""}${c.dont ? " Не брать: " + c.dont : ""}${c.src ? " Источник: " + c.src : ""}`);
        o.push("");
      }
    }
  }
}
window.atlasToMarkdown = function(){
  const o = ["# " + PROJECT.heading, "", PROJECT.lede, ""];
  for (const s of STAGES) {
    o.push(`## ${s.n} · ${s.title}`, "", `*${s.q}* Статус: ${STATUS[s.status]}.`, "");
    if (s.skip) o.push("Пропущен: " + s.skip, "");
    if (s.conclusions.length) o.push("### Выводы для решения", "", ...s.conclusions.map(c => "- " + c), "");
    for (const u of s.outputs) { o.push("### " + u.title, ""); u.blocks.length ? u.blocks.forEach(b => mdBlock(b, o)) : o.push("Пока пусто.", ""); }
    const rest = s.todo.filter(t => t.kind === "question" || t.kind === "decision");
    if (rest.length) o.push("### Открыто", "", ...rest.map(t => `- ${KIND[t.kind]}: ${t.t}`), "");
  }
  return o.join("\n");
};
(async () => {
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  const box = document.getElementById("dl"), msg = document.getElementById("dlmsg"), link = document.getElementById("dlpdf");
  if (!dl) { link.hidden = false; return; }
  box.hidden = false;
  const ERR = {declined:"Скачивание отменено.", rate_limited:"Подождите немного и попробуйте снова.", missing:"PDF не найден рядом со страницей."};
  const stamp = new Date().toISOString().slice(0, 10), base = PROJECT.product.split(" ")[0].toLowerCase();
  box.addEventListener("click", async e => {
    const b = e.target.closest("[data-dl]"); if (!b) return;
    msg.textContent = "Готовлю файл…";
    try {
      let data, filename;
      if (b.dataset.dl === "md") { data = window.atlasToMarkdown(); filename = `${base}-atlas-${stamp}.md`; }
      else {
        const r = await fetch(new URL("atlas.pdf", location.href), {cache: "no-store"});
        const buf = r.ok ? await r.arrayBuffer() : null;
        if (!buf || buf.byteLength < 1024 || new TextDecoder().decode(new Uint8Array(buf, 0, 4)) !== "%PDF") throw {code:"missing"};
        data = new Uint8Array(buf); filename = `${base}-atlas.pdf`;
      }
      await dl.save({filename, data});
      msg.textContent = "Готово.";
    } catch (err) {
      msg.textContent = ERR[err && err.code] || "Скачивание сейчас недоступно.";
      if (b.dataset.dl === "pdf" && !(err && err.code === "declined")) link.hidden = false;
    }
  });
})();
document.getElementById("brand").textContent = PROJECT.product;
q.addEventListener("input", () => { const t = q.value.trim(); t.length > 1 ? search(t) : route(); });
window.addEventListener("hashchange", route);
route();
connectPrio();
</script>
