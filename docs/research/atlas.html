<title>Атлас Tigertriever</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a research logbook — stage index stays on the left, one stage per view, overview opens on what is unfinished */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#EBEFF3; --fg:#121820; --muted:#566170; --faint:#6F7A88; --line:#D9DFE6;
  --accent:#3A3FB8; --accent-soft:#E6E7FA; --c-mon:#3A3FB8; --c-ann:#00869F; --l0:#C5CCD6;
  --p0:#3A3FB8; --p0-soft:#E6E7FA; --p1:#2E8396; --p1-soft:#DCEBEE; --p2:#6B7480; --p2-soft:#E8ECF0; --no:#B23A35; --no-soft:#F8E1DF;
  --l1:#DCEBEE; --l2:#AED3DA; --l3:#6DB0BD; --l4:#2E8396; --l5:#13505F;
  --l1-ink:#23434B; --l2-ink:#183A42; --l3-ink:#0D2E36; --l4-ink:#FFFFFF; --l5-ink:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --bad:#B23A35; --bad-soft:#F8E1DF; --warn:#8A5E06; --warn-soft:#F7EBCF; --none:#5F6873; --none-soft:#E8ECF0;
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#161D24; --sunk:#1C252E; --fg:#E6EBF0; --muted:#9AA6B3; --faint:#7F8B98; --line:#2A3540;
  --accent:#9A9EF5; --accent-soft:#25275A; --c-mon:#6E73E8; --c-ann:#0097AF; --l0:#3A4450;
  --p0:#9A9EF5; --p0-soft:#25275A; --p1:#4BA6B8; --p1-soft:#1E3439; --p2:#9AA6B3; --p2-soft:#232D37; --no:#F08A84; --no-soft:#3E1D1C;
  --l1:#1E3439; --l2:#24525C; --l3:#2F7C8B; --l4:#4BA6B8; --l5:#8ED6E4;
  --l1-ink:#BFDDE3; --l2-ink:#D5EEF2; --l3-ink:#FFFFFF; --l4-ink:#06222A; --l5-ink:#06222A;
  --ok:#5CC98F; --ok-soft:#163A28; --bad:#F08A84; --bad-soft:#3E1D1C; --warn:#E3B556; --warn-soft:#3A2E12; --none:#9AA6B3; --none-soft:#232D37;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#161D24; --sunk:#1C252E; --fg:#E6EBF0; --muted:#9AA6B3; --faint:#7F8B98; --line:#2A3540;
  --accent:#9A9EF5; --accent-soft:#25275A; --c-mon:#6E73E8; --c-ann:#0097AF; --l0:#3A4450;
  --p0:#9A9EF5; --p0-soft:#25275A; --p1:#4BA6B8; --p1-soft:#1E3439; --p2:#9AA6B3; --p2-soft:#232D37; --no:#F08A84; --no-soft:#3E1D1C;
  --l1:#1E3439; --l2:#24525C; --l3:#2F7C8B; --l4:#4BA6B8; --l5:#8ED6E4;
  --l1-ink:#BFDDE3; --l2-ink:#D5EEF2; --l3-ink:#FFFFFF; --l4-ink:#06222A; --l5-ink:#06222A;
  --ok:#5CC98F; --ok-soft:#163A28; --bad:#F08A84; --bad-soft:#3E1D1C; --warn:#E3B556; --warn-soft:#3A2E12; --none:#9AA6B3; --none-soft:#232D37;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
.shell{max-width:1320px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 64px;display:grid;grid-template-columns:292px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto;display:grid;gap:12px;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:14px;color:var(--fg);text-decoration:none;line-height:1.3}
.side input{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
nav{display:grid;gap:12px;min-width:0}
.ngroup{display:grid;gap:1px;min-width:0}
.nlabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 3px}
.nitem{display:grid;grid-template-columns:14px 24px minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.25}
.nitem:hover{background:var(--sunk)}
.nitem[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nitem .num{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.nitem .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nover{grid-template-columns:minmax(0,1fr) auto}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--c);background:var(--fill);display:inline-block;flex:none}
.s-todo{--c:var(--none);--fill:transparent}
.s-work{--c:var(--warn);--fill:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.s-review{--c:var(--accent);--fill:var(--accent-soft)}
.s-done{--c:var(--ok);--fill:var(--ok)}
.s-skip{--c:var(--line);--fill:var(--line)}
main{display:grid;gap:22px;min-width:0}
main > *{min-width:0}
main p,main li,main h3,summary{overflow-wrap:anywhere}
main td{overflow-wrap:break-word;hyphens:auto}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.3;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.lede{max-width:72ch;margin:8px 0 0}
.muted{color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tally div{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tally b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c)}
.tally span{font-size:13px;color:var(--muted)}
.next{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.next p{margin:0}
.next a{font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--muted)}
.todo{display:grid;gap:10px}
.tstage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:8px}
.th{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.th a{font-weight:600;color:var(--fg);text-decoration:none}
.th a:hover{color:var(--accent)}
.tstage ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.tstage li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;font-size:14px}
.k{font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--muted)}
.k.moved{color:var(--warn)} .k.review,.k.decision{color:var(--accent)} .k.missing{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.t-ok,.p-done{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn,.p-work{background:var(--warn-soft);color:var(--warn)}
.t-none,.p-todo,.p-skip{background:var(--none-soft);color:var(--none)} .p-review{background:var(--accent-soft);color:var(--accent)}
.sh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.box ul{margin:0;padding-left:18px;display:grid;gap:5px;max-width:78ch}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.sec-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.sec p{margin:0;max-width:78ch}
.sec > ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:78ch}
.empty{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--muted)}
.claims{display:grid;gap:8px}
.claim{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;font-size:14.5px}
.claim .lab{font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--muted)}
.claim .lab .lv{margin-left:4px}
.claim .src{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lv{font-family:var(--mono);font-weight:700;font-size:10.5px;border-radius:999px;padding:0 6px;line-height:1.6;display:inline-block}
.lv1{background:var(--l1);color:var(--l1-ink)} .lv2{background:var(--l2);color:var(--l2-ink)} .lv3{background:var(--l3);color:var(--l3-ink)} .lv4{background:var(--l4);color:var(--l4-ink)} .lv5{background:var(--l5);color:var(--l5-ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;min-width:88px}
td.wide{min-width:240px}
tr:last-child td{border-bottom:0}
details.fold{min-width:0}
details.fold > summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
details.fold > .tbl{margin-top:8px}
.fin{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:8px 0 14px}
.fin p{margin:0;max-width:78ch}
.fin > ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:78ch}
.fin .tbl td{font-size:13.5px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.shots figure{margin:0;display:grid;gap:6px;align-content:start;min-width:0}
.shots img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.shots figcaption{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.shot{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.noshot{aspect-ratio:4/3;display:grid;place-content:center;text-align:center;gap:2px;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
#lb{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.86);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#lb img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;min-height:0}
#lb p{margin:0 auto;max-width:72ch;color:#fff;font-size:14px;text-align:center}
#lb button{position:absolute;top:max(12px, env(safe-area-inset-top, 0px));right:max(12px, env(safe-area-inset-right, 0px));font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:0;background:#fff;color:#121820;cursor:pointer}
.dl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.dl button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.dl span{color:var(--muted);flex-basis:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ctl input,.ctl select{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;max-width:100%}
.ctl input{flex:1 1 200px}
.ctl .cnt{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-left:auto}
.ctl .lab{font-size:12.5px;color:var(--muted)}
.stacks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.stackbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.bar{display:flex;gap:2px;height:14px}
.bar i{display:block;border-radius:3px;min-width:4px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.lg span{display:inline-flex;gap:5px;align-items:center}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.pbuckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pb{background:var(--surface);padding:12px 14px;display:grid;gap:3px;align-content:start;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
.pb:hover{background:var(--sunk)}
.pb[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--c)}
.pb b{font-family:var(--display);font-size:26px;font-weight:700;color:var(--c);line-height:1.1;font-variant-numeric:tabular-nums}
.pb span{font-size:13px;color:var(--muted)}
.c-p0{--c:var(--p0);--c-soft:var(--p0-soft)} .c-p1{--c:var(--p1);--c-soft:var(--p1-soft)} .c-p2{--c:var(--p2);--c-soft:var(--p2-soft)} .c-no{--c:var(--no);--c-soft:var(--no-soft)}
.pgroup{display:grid;gap:8px}
.pgroup .tag{font-family:var(--mono);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--c-soft);color:var(--c)}
.ph{display:flex;gap:10px;align-items:baseline}
td.f{min-width:210px;width:24%} td.nw{min-width:170px;width:20%} td.rs{min-width:220px;width:26%} td.cm{min-width:110px;width:11%} td.pr{min-width:180px;width:19%}
.fname{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.job{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;cursor:help;background:var(--bg)}
.note{font-size:13px;color:var(--muted)}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ref{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 2px;display:inline-flex;gap:5px;align-items:center;color:var(--fg);text-decoration:none;background:var(--bg)}
.ref:hover{border-color:var(--accent)}
.lvx{background:var(--sunk);color:var(--muted)}
.pr select{font:inherit;font-size:13.5px;font-weight:600;padding:5px 8px;border-radius:8px;border:1px solid var(--line);width:100%;background:var(--c-soft);color:var(--c)}
.pr select:disabled{opacity:1}
.pr textarea{font:inherit;font-size:13px;width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical;min-height:34px}
.why{font-size:13px;margin-top:6px}
.changed{font-size:12px;color:var(--accent);margin-top:4px}
.decide{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 7px;margin-top:6px}
.more{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:4px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
tr.detail > td{background:var(--sunk);padding:14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.dgrid p,.comp p{margin:2px 0 0;font-size:14px;max-width:72ch}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:8px}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0;overflow-wrap:anywhere}
.kv{display:flex;gap:8px;align-items:baseline;font-size:13.5px;margin-top:6px}
.kk{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;flex:none}
.kk.take{background:var(--ok-soft);color:var(--ok)} .kk.dont{background:var(--bad-soft);color:var(--bad)}
.srcs{font-size:12px;color:var(--muted);margin-top:6px}
.chk{font-family:var(--mono);font-size:10px;font-weight:500;padding:1px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);white-space:nowrap} .chk.ok{background:var(--ok-soft);color:var(--ok)}
.gapnote{margin-top:12px;font-size:14px;background:var(--warn-soft);border-radius:8px;padding:10px 12px}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.card > summary{cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline}
details.card .cq{grid-column:2;font-size:13.5px;color:var(--muted)}
details.card .cm2{grid-column:2;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
details.card > .fin{padding:4px 14px 14px}
.cards{display:grid;gap:6px}
.pchart svg{display:block;width:100%;min-width:560px;max-width:900px}
@media (max-width:760px){
  .ptable,.ptable tbody,.ptable tr,.ptable td{display:block;width:auto!important;min-width:0!important}
  .ptable thead{display:none}
  .ptable tr{border-bottom:1px solid var(--line);padding:4px 0}
  .ptable td{border:0;padding:8px 12px}
  .ptable td::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
}
@media print{
  .side,.ctl,.dl,#lb,.more{display:none!important}
  .shell{display:block;max-width:none;padding:0}
  figure,tr,.claim,.box{break-inside:avoid}
  .stage-all{break-before:page}
}
.foot{font-size:13px;color:var(--muted);margin:0}
.linkrow{display:grid;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;text-decoration:none;color:var(--fg);overflow-wrap:anywhere}
a.linkrow:hover{border-color:var(--accent)}
.linkrow small{font-size:12.5px;color:var(--muted)}
.hit{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.hit small{color:var(--muted);font-size:12.5px}
mark{background:var(--warn-soft);color:var(--fg);border-radius:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{position:static;max-height:none;overflow:visible}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .ngroup{display:flex;gap:6px;flex:none}
  .nlabel{display:none}
  .nitem,.nover{display:flex;flex:none;background:var(--surface);border:1px solid var(--line);white-space:nowrap}

const STAGES = [{"id": "frame", "n": "00", "part": "Рамка", "title": "Рамка исследования", "skill": "research-frame", "q": "Какое решение мы принимаем и что для этого нужно узнать?", "needs": [], "outputs": [{"key": "about", "title": "О компании и продукте", "hint": "Что за компания и продукт, для кого, стадия, позиционирование. С метками: откуда известно.", "blocks": [{"type": "text", "t": "**Компания.** Rapid Medical производит нейроваскулярные изделия: стент-ретривер TIGERTRIEVER, COMANECI, DRIVEWIRE и COLUMBUS. Сайт компании переезжает с Duda в этот же репозиторий."}, {"type": "text", "t": "**Продукт.** Обучающий инструмент по Tigertriever из двух частей. Первая часть: офлайн-пакет для врача, ZIP, который открывается без сети. Вторая: онлайн Content Studio, где маркетинг правит уроки и собирает пакеты. Studio живёт в общей админке с сайтом: вход, затем выбор «сайт или инструмент»."}, {"type": "claims", "items": [{"t": "Rapid Medical производит нейроваскулярные изделия; Tigertriever один из её продуктов.", "label": "fact", "level": 2, "src": "docs/spec.md → Продукт"}, {"t": "Инструмент и сайт живут в одном репозитории и делят одну админку.", "label": "input", "level": 3, "src": "docs/memory/decisions/ADR-005-one-repo-unified-admin.md"}, {"t": "Инструмент бесплатный: Rapid Medical раздаёт его своим клиентам. Цен, оплаты и лицензий нет.", "label": "input", "level": 3, "src": "владелица, 2026-11-08; docs/spec.md → Инструмент Tigertriever"}, {"t": "Для кого: врачи. Клиент описывает два способа: сессия с представителем компании и самостоятельный просмотр.", "label": "input", "level": 2, "src": "черновик клиента v0.10 (июль 2026), через docs/tigertriever/research/final-desk-research-synthesis-v0.4.md (F01)"}, {"t": "Формат урока по черновику клиента: заголовок-фраза и 3–4 пункта рядом с клипом, play и pause, без озвучки. Программа: Opening, 8 процедурных этапов, Closing.", "label": "input", "level": 2, "src": "docs/memory/findings/client-brief-lesson-content.md"}, {"t": "У Tiger 13 две ручки: старый слайдер (есть у нескольких моделей) и новая кнопка. Часть этапов одинакова для обеих ручек, часть различается. В июле клипы новой ручки для нескольких этапов ещё не были сняты.", "label": "input", "level": 2, "src": "docs/memory/findings/client-brief-lesson-content.md"}, {"t": "Рынки инструмента по вайрфрейму клиента: US, Europe, Asia Pacific. Выбор ручки есть только у Tiger 13 и недоступен в Asia Pacific.", "label": "input", "level": 2, "src": "docs/memory/findings/client-brief-lesson-content.md"}, {"t": "Отдельного шага согласования нет: Publish в Studio означает собрать новый пакет. Ресёрч описывал шаг одобрения, это решение его отменяет.", "label": "input", "level": 3, "src": "docs/memory/decisions/ADR-006-admin-work-model.md"}, {"t": "Стадия: кода инструмента нет. Есть кабинетный ресёрч (октябрь–ноябрь 2026), учебный прототип v0.3, прототип Content Studio v0.1 и тестовый офлайн-пакет S0.", "label": "fact", "level": 3, "src": "docs/tigertriever/README.md; docs/memory/BACKLOG.md"}, {"t": "Принят вариант Option #3 Interactive Learning Tool. Построчного объёма договора у нас нет, только пересказ в переписке.", "label": "limit", "level": 2, "src": "docs/tigertriever/tables/source-register.csv (SRC-03)"}]}, {"type": "sub", "t": "Что легко понять неверно"}, {"type": "list", "items": ["Это не клиническое руководство и не сертификация. Нет тестов, аккаунтов, оценки компетенции и советов по выбору устройства.", "«Stage» в вайрфрейме клиента означает фазу выпуска контента (сначала Tiger 13 и 17, потом 21 и 25), а не процедурный этап.", "Рынки инструмента не совпадают с регионами сайта (US, OUS, APAC). Это разные справочники.", "Черновик клиента помечен FOR REVIEW. Его клинические тексты не утверждены, в репозиторий и атлас не переносятся.", "Клиент называет обучение непромоционным, но во вступлении его черновика есть сравнительные утверждения и данные исследований.", "Маркетинг Rapid Medical даёт факты об объёме и материалах. Он не проектир , REP-03"], ["В6", "Возвращается ли врач к одному этапу отдельно от курса и как его ищет?", "06 JTBD, функции и метрики", {"level": 5}, "Общие исследования о сегментации и коротком повторе (L2), паттерны бенчмарка (L2)", "PHY-04, задание «найди Deployment»"], ["В7", "Понимает ли врач, для какой модели, ручки и рынка урок, и не путает ли варианты?", "08 Сценарии и принципы", {"level": 5}, "Принципы P1 и P4 ресёрча (L2, вывод)", "PHY-06, задания L-T1 и L-T4 на прототипе"], ["В8", "Принимают ли недоступную сторону сравнения за «то же самое»?", "08 Сценарии и принципы", {"level": 5}, "Правило дизайна D13 (L2, вывод)", "Задание L-T5 на прототипе"], ["В9", "Кто в Rapid Medical правит уроки и нажимает Publish; должен ли кто-то из медицины или регуляторики смотреть пакет до выпуска?", "05 Роли и сегменты", {"level": 2}, "В админке будут 3–4 человека, согласования нет (ADR-006, вводная). Ресёрч писал о маркетинге из двух человек (L2)", "Имена и роли от маркетинга (MKT-02, MED-08, T3)"], ["В10", "Видит ли редактор до Publish, где ещё используется клип и что изменится в пакете?", "08 Сценарии и принципы", {"level": 5}, "Паттерны Dozuki, Payload, Strapi (L2)", "Задания для редакторов E1–E6"], ["В11", "Что происходит с уже разосланным пакетом, когда клип исправили?", "03 Как работают сейчас", {"level": 2}, "Ничего: отозвать файл с чужого компьютера нельзя", "Ответ маркетинга (OPS-05, S7), пример случая (ED-09)"]]}], "state": "filled"}, {"key": "assumptions", "title": "Реестр допущений", "hint": "Что принимаем на веру: утверждение, откуда взялось, вердикт, что будет, если неверно.", "blocks": [{"type": "text", "t": "Реестр живой: этапы дописывают сюда вердикты. Критичное: если неверно, одно из решений падает. Критичные идут первыми на проверку на людях."}, {"type": "table", "head": ["№", "Допущение", "Откуда", "Вердикт", "Что показали", "Если неверно", "Критичное"], "filter": [{"col": 3, "label": "Вердикт", "kind": "chips"}, {"col": 6, "label": "Критичное", "kind": "chips"}], "ro ем шагами, от первого действия до результата", "У каждого шага понятно, кто его делает", "Что сказал представитель или участник, помечаем отдельно", "Техническая возможность не значит, что так уже работает", "Данные не про нашу аудиторию помечаем ограничением", "Догадку не записываем как факт: у шага есть уровень и способ проверки"], "tools": ["/current-process", "файлы проекта, данные и корпус", "интервью, если есть"], "done": ["Названы участники и их роли", "Путь записан по шагам с уровнями", "Собраны обходные приёмы", "Сведены данные", "Выводы для решения", "Вопросы к людям вынесены в открытые", "Владелец подтвердил этап"]}, "conclusions": ["**О том, как врачи учатся сегодня, данных нет.** Всё, что ниже о врачах, гипотеза уровня L1 из черновика клиента и общих исследований. Закрыть её могут только разговоры с маркетингом и 2–3 представителями.", "**Центр процесса сегодня: представитель и in-service.** Клиент прямо называет сессии с представителем, а часть клипов взята из in-service съёмки. Инструмент должен встроиться в эту сессию, а не заменить её (L2 по намерению клиента, L1 по тому, как сессия идёт).", "**Материал собирают вручную в документе.** Черновик в PDF, цветные статусы съёмки, клипы, нарезанные из длинных записей кейсов, пометка «All handles — same». Это прямая подсказка для Content Studio: статусы готовности, исходник клипа, общий текст для нескольких ручек (L2).", "**Новой ручке материала не хватает.** В июле у 4 этапов из 8 не было материала для кнопки T13: нужна съёмка или поиск в библиотеке кейсов. Врач, переходящий со слайдера, сегодня получает объяснение от представителя или нигде (L2 по статусам, L1 по врачам).", "**Публичный сайт сейчас единственный открытый источник для врача.** Страницы продукта на Duda маркетинговые, этапов там нет, IFU и вебинары по запросу. Учебного пути он не заменяет (L2)."], "confirmed": null, "skip": null, "status": "review", "skillReady": true, "todo": [{"kind": "review", "t": "Прочитать и подтвердить этап"}, {"kind": "question", "t": "Как идёт типичная сессия с представителем: где, на каком устройстве, сколько длится, какие этапы повторяют (REP-01, вопрос T8)"}, {"kind": "question", "t": "Что представители отправляют врачам после сессии и через какие каналы (OPS-01)"}, {"kind": "question", "t": "Как и когда врач возвращается к материалу перед случаем"}, {"kind": "question", "t": "Кто проверяет медицинский текст сейчас и сколько это занимает (MED-08)"}, {"kind": "question", "t": "Что из съёмок новой ручки снято после июля (SCOPE-08)"}, {"kind": "decision", "t": "Запросить ли данные GA4 по страницам продукта на Duda как первый замер поведения врачей"}, {"kind": "decision", "t": "Провести ли 2–3 интервью с представителями до прототипа v0.4"}], "filled": 4, "total": 4}, {"id": "problem", "n": "04", "part": "Смысл", "title": "Проблема и решение", "skill": "problem-solution", "q": "Что именно ломается, у кого, и какой ответ мы предлагаем?", "needs": [{"id": "process", "title": "Как работают сейчас"}, {"id": "desk", "title": "Контекст и рынок"}], "outputs": [{"key": "context", "title": "Контекст проблемы", "hint": "Что происходит и откуда это известно; конкурентный контекст и вводные с метками.", "blocks": [{"type": "text", "t": "Rapid Medical выпускает стент-ретривер Tigertriever: модели Tiger 13, 17, 17U, 21 и 25. У Tiger 13 появилась новая ручка с регулятором-кнопкой (precision knob) вместо прежнего слайдера. Компания хочет дать врачам учебный инструмент: короткий текст рядом с клипом по каждому из восьми этапов процедуры, плюс вступление и заключение. Инструмент работает без сети. Его ведёт представитель на сессии, или врач открывает сам."}, {"type": "text", "t": "Вторая часть продукта: Content Studio в общей админке с сайтом (ADR-005). Там маркетинг клиента правит уроки и выпускает новые версии пакета. Отдельного согласования нет: Publish собирает новый замороженный пакет, старые не меняются (ADR-006)."}, {"type": "claims", "items": [{"t": "Инструмент бесплатный: Rapid Medical раздаёт его своим клиентам, цен, оплаты и лицензий нет. Цели и метрики не опираются на выручку.", "label": "input", "level": 2, "src": "Владелица, 2026-11-08; docs/spec.md → Инструмент Tigertriever"}, {"t": "Аудитория: врачи. Использование: с представителем и самостоятельно. Формат: заголовок и 3–4 пункта рядом с клипом, без озвучки. Нужна офлайн-версия.", "label": "input", "level": 2, "src": "Черновик клиента v0.10, июль 2026, стр. 1–2; docs/memory/findings/client-brief-lesson-content.md"}, {"t": "Старая ручка (слайдер) у T13, T17, T17U, T21, T25 для крупных сосудов; новая (кнопка) только у T13 для дистальных окклюзий. По вайрфрейму выбор ручки есть только у Tiger 13 и недоступен в Asia Pacific.", "label": "input", "level": 2, "src": "Черновик v0.10, стр. 2; вайрфрейм 14.10.2026"}, {"t": "Клиент называет обучение непромоционным, при этом черновик вступления содержит сравнительные утверждения и данные исследований.", "label": "input", "level": 2, "src": "Черновик v0.10; docs/tigertriever/tables/client-request-audit.csv, CR-03"}, {"t": "Тексты на сайтах US и OUS расходятся, OUS не равно EU. Сайт не источник одобренных инструкций.", "label": "external", "level": 2, "src": "us.rapid-medical.com, ous.rapid-medical.com; final-desk-research-synthesis-v0.4.md, F08"}, {"t": "Инструмент дополняет практическое обучение тромбэктомии под надзором, а не заменяет его. Видео само не делает врача готовым к процедуре.", "label": "external", "level": 2, "src": "Международный консенсус по обучению эндоваскулярному лечению инсульта, 2016 [S1]; context-of-use.md, 4.1–4.2"}, {"t": "У Medtronic есть Touch Surgery: пошаговые модули с загрузкой офлайн. Сравнения двух вариантов устройства на одном шаге не нашли ни у кого из 10 продуктов бенчмарка.", "label": "external", "level": 2, "src": "docs/research/stages/benchmark.json"}, {"t": "Ни одного врача, представителя или редактора по Tigertriever не опрашивали. Контекст собран из материалов клиента и кабинетного ресёрча.", "label": "limit", "level": 1, "src": "final-desk-research-synthesis-v0.4.md, раздел 1; jtbd-map-v0.1.md"}]}], "state": "filled"}, {"key": "losses", "title": "Где возникает проблема", "hint": "Точки потерь: что известно, риск, статус причин.", "blocks": [{"type": "text", "t": "Частоты и время ни по одной точке не измерены. «Известно» значит, что это есть в материалах клиента или в технических фактах; «допущение» значит, что это наш вывод и его надо проверить на людях."}, {"type": "table", "head": ["Точка потерь", "Что происходит", "Риск", "Статус причин"], "rows": [["1. Материал не той конфигурации или рынка", "Одна модель существует в нескольких ручках и рынках, тексты по рынкам расходятся. Врач или представитель может открыть материал для другой ручки или другого рынка и не заметить этого.", "Врач учится по инструкции, которая к его устройству не относится. Регуляторный риск для компании.", {"t": "Известно: расхождения есть. Допущение: путаница случается. Проверить: REP-04, PHY-06", "tone": "warn"}], ["2. Смена ручки: слайдер → кнопка", "Врач знает Tigertriever со слайдером, больница берёт Tiger 13 с кнопкой. Часть этапов одинакова, часть различается. Привычка от старой ручки может перейти на новую.", "Неуверенность или ошибка в работе с ручкой на первых случаях; медленный переход на Tiger 13.", {"t": "Известно: этапы различаются (черновик клиента). Допущение: врачи путаются. Проверить: PHY-05, REP-03", "tone": "warn"}], ["3. Нет клипов новой ручки", "На июль у кнопки нужно было снять Positioning, Deployment, Prepare to retrieve и Retrieval; Clot interaction пересмотреть. Снимает Emily, часть на стенде.", "Сравнение ручек неполное. Пустое место легко прочесть как «тут всё так же».", {"t": "Известно на июль 2026. Текущий статус неизвестен: SCOPE-08, MED-06", "tone": "warn"}], ["4. Представителя нет рядом", "Клиент предполагает и сессии с представителем, и самостоятельную работу. После сессии врачу, чтобы вспомнить шаг, нужно снова звать представителя или искать файлы.", "Время представителя уходит на повторы; врач перед случаем остаётся без опоры.", {"t": "Допущение. Проверить: PHY-09, REP-01, REP-06", "tone": "none"}], ["5. Устаревшие файлы на компьютерах", "Офлайн-копию нельзя удалённо обновить или отозвать. Старая версия продолжает жить на ноутбуке врача или представителя.", "Врач смотрит снятый с использования клип или неактуальный текст и не знает об этом.", {"t": "Известно: технически отзыва нет. Допущение: старые копии в ходу. Проверить: REP-07, ED-09, OPS-05", "tone": "warn"}], ["6. Ограничения офлайна в больницах", "Неизвестно, на каких машинах и браузерах откроют пакет и разрешены ли локальные файлы. Тестовый пакет S0 проверен только в Chrome на Маке.", "Пакет не открывается или видео не играет на месте; сессия срывается.", {"t": "Известно: среда не определена. Проверить: OPS-01…03, спайк S0 на машинах клиента", "tone": "warn"}], ["7. Правка без видимости последствий", "Один клип используют несколько конфигураций. Маркетинг меняет его в одном месте и не видит, где ещё он стоит.", "Клип попадает в урок, к которому не относится; материалы расходятся по рынкам.", {"t": "Допущение по нашей модели контента. Проверить: ED-02, ED-03", "tone": "none"}]]}, {"type": "sub", "t": "Что продуктовой проблемой не является"}, {"type": "list", "items": ["Подготовка врача к тромбэктомии в целом. Её дают практика и обучение под надзором; инструмент только про устройство.", "Решения во время процедуры. Использование в операционной не проектируем без отдельного решения клиента.", "Съёмка недостающих клипов и одобрение текстов. Это работа клиента; продукт только честно показывает, чего нет.", "Политика IT больниц. Интерфейс её не изменит, мы можем только проверить совместимость.", "Выбор устройства для пациента. Инструмент не рекомендует модель."]}], "state": "filled"}, {"key": "user_problem", "title": "Проблема пользователя", "hint": "Одной связной формулировкой.", "blocks": [{"type": "text", "t": "**Врач:** «Когда я начинаю работать с Tigertriever или перехожу на новую ручку Tiger 13, мне трудно быстро понять, что именно меняется для моего устройства на моём рынке. Я не уверен, что материал передо мной про мою конфигурацию и что он актуален, а вернуться к одному шагу без представителя сложно»."}, {"type": "text", "t": "Вторая роль со своей проблемой, маркетинг клиента: «Когда приходит новый клип или правка, я не вижу, где ещё этот материал используется и что уже ушло врачам, поэтому боюсь что-то сломать и выпускаю обновления редко»."}, {"type": "claims", "items": [{"t": "Обе формулировки собраны из работ P01, P02, P03, P05, P08 и E01, E03 карты JTBD. Ни одну не проверяли на людях.", "label": "inference", "level": 1, "src": "docs/tigertriever/research/jtbd-map-v0.1.md"}]}], "state": "filled"}, {"key": "business_problem", "title": "Проблема бизнеса", "hint": "Плюс долгосрочный риск доверия и конкурентный риск.", "blocks": [{"type": "text", "t": "Инструмент бесплатный, поэтому компания теряет не деньги с продаж обучения. Она теряет то, ради чего обучение раздаёт:"}, {"type": "list", "items": ["**Правильное использование и уверенность.** Врач, который не понял разницу ручек, работает с устройством неуверенно или с ошибкой.", "**Переход на Tiger 13 с кнопкой.** Если новая ручка кажется непонятной, врач остаётся на привычной.", "**Время представителей.** Повторы одних и тех же объяснений вместо работы со сложными вопросами.", "**Одинаковое обучение на всех рынках.** Сейчас нет одного источника: каждый представитель может показывать свои файлы.", "**Актуальность.** Два маркетолога не могут быстро и безопасно обновить материал, если для каждой правки нужен разработчик.", "**Регуляторная безопасность.** Материал для чужого рынка или неодобренное сравнительное утверждение в «непромоционном» обучении."]}, {"type": "sub", "t": "Долгосрочный риск доверия"}, {"type": "text", "t": "Обучение говорит от имени производителя. Если врач однажды найдёт в нём устаревший клип, материал не для своего рынка или «одинаково», которое на деле не так, он перестанет доверять и инструменту, и тому, что компания говорит об устройстве."}, {"type": "sub", "t": "Конкурентный риск"}, {"type": "text", "t": "У крупных производителей есть свои цифровые программы обучения, например Touch Surgery у Medtronic. Если переход на новую ручку Tigertriever даётся врачу труднее, чем работа с привычным устройством конкурента, ему проще остаться на привычном."}, {"type": "claims", "items": [{"t": "Масштаб потерь не измерен: нет данных о частоте ошибок, времени представителей и скорости перехода на Tiger 13.", "label": "limit", "level": 1, "src": "Источников по этим величинам не нашли"}, {"t": "Связь «непонятная ручка → врач остаётся на привычном устройстве»: наш вывод, не данные.", "label": "inference", "level": 1, "src": "Рассуждение этого этапа"}, {"t": "Цель клиента в админке: маркетинг правит тексты, видео и картинки сам и выпускает новую версию обучения.", "label": "input", "level": 2, "src": "client-request-audit.csv, CR-18, CR-27"}]}], "state": "filled"}, {"key": "solution", "title": "Решение", "hint": "Высокоуровневая задача и связный рассказ, без экранов.", "blocks": [{"type": "text", "t": "**Задача:** дать врачу учебный материал, точный для его конфигурации и рынка, который работает без сети и показывает разницу ручек на том же этапе, а маркетингу дать способ держать этот материал актуальным."}, {"type": "text", "t": "Врач получает пакет для своего рынка. Открывает его на своём компьютере без интернета и сразу видит, какая модель, ручка, рынок и версия перед ним. Если в пакете одна конфигурация, выбирать ничего не нужно. Он может пройти все этапы по порядку вместе с представителем или открыть один этап сам вечером перед случаем."}, {"type": "text", "t": "На каждом этапе клип и короткий текст видны вместе. Если врач переходит со слайдера на кнопку, он смотрит тот же этап для обеих ручек и видит, где клиент пометил «одинаково», а где разницу. Если клипа для одной ручки нет, так и написано: материала нет, а не «всё так же»."}, {"type": "text", "t": "Представитель ведёт сессию на том же материале. Он переходит к нужному этапу без поиска, повторяет клип и показывает разницу ручек. После сессии врачу не нужен представитель, чтобы вернуться к шагу."}, {"type": "text", "t": "Маркетинг правит урок в общей админке. Перед заменой клипа видит, где ещё он используется, и выбирает, менять везде или только здесь. Publish проверяет, что у этапов есть медиа и у пар есть обе стороны, и собирает новую замороженную версию пакета. Видно, какая версия собрана и какая уже отправлена."}, {"type": "claims", "items": [{"t": "Решение опирается на рамку кабинетного ресёрча: точная применимость без подмены, один плеер этапа для последовательного и прямого входа, неизменяемый релиз.", "label": "input", "level": 2, "src": "final-desk-research-synthesis-v0.4.md, разделы 2–5; docs/spec.md → Инструмент Tigertriever"}, {"t": "Переключение ручки на том же этапе и режим показа для представителя взяты из бенчмарка; в медицинских продуктах выборки такого нет.", "label": "pattern", "level": 2, "src": "docs/research/stages/benchmark.json"}]}], "state": "filled"}, {"key": "effect", "title": "Ожидаемый эффект", "hint": "«Решение потенциально может…»: результаты списком.", "blocks": [{"type": "text", "t": "Решение потенциально может:"}, {"type": "list", "items": ["снизить число случаев, когда врач смотрит материал не для своей ручки или рынка;", "помочь врачу, который переходит со слайдера, понять разницу кнопки до первого случая;", "сократить повторы у представителей: врач возвращается к этапу сам;", "выровнять обучение по рынкам: у всех один источник и видимая версия;", "сократить время от нового клипа до врача: маркетинг выпускает версию без разработчика;", "снизить регуляторный риск: в пакет не попадает материал без медиа, без пары или для другого рынка."]}, {"type": "claims", "items": [{"t": "Эффект не измерен и не проверен. Общие данные о пошаговом обучении и подсказках есть, но не для Tigertriever и не для клинических исходов.", "label": "limit", "level": 2, "src": "Rey et al., 2019; Branzetti et al., 2017; context-of-use.md, раздел 4"}]}], "state": "filled"}, {"key": "metrics", "title": "Метрики", "hint": "Основной продуктовый результат, операционный результат, защитная метрика.", "blocks": [{"type": "text", "t": "В офлайн-пакете нет аналитики, и добавлять её без решения клиента и IT больниц нельзя. Поэтому метрики берём из того, что можно посчитать без слежки за врачом: задания на тестах, данные Content Studio, история пакетов."}, {"type": "table", "head": ["Метрика", "Что значит", "Как считаем", "Что нужно"], "rows": [["**Основной продуктовый:** правильное понимание конфигурации и разницы ручек", "Доля врачей, которые в задании называют свою модель, ручку, рынок и версию и верно объясняют одобренную разницу ручек на этапе, не принимая пустое место за «одинаково»", "Задания на прототипе и на первом пакете с 5–8 врачами (L-T1, L-T3, L-T5). Плюс короткий вопрос представителю после сессии", {"t": "Порог не задан; доступ к врачам через маркетинг", "tone": "warn"}], ["**Операционный:** время от правки до отправленного пакета", "Сколько дней проходит от загрузки нового клипа или правки текста до пакета со статусом Sent", "Даты в Content Studio: правка урока, Built, Sent. Считается автоматически", {"t": "Работает, если маркетинг отмечает Sent", "tone": "ok"}], ["**Защитная:** ноль ошибок применимости", "Число пакетов, которые пришлось исправлять из-за материала не той конфигурации или рынка или из-за неодобренного утверждения о разнице", "Причина исправления в истории пакетов; блокеры Publish; ошибки «ложного равенства» в задании L-T5", {"t": "Нужно поле «причина новой версии» в Packages", "tone": "warn"}]]}, {"type": "text", "t": "Кандидат на вторую очередь: время представителя на сессию и число повторных запросов после неё. Без опроса представителей не считается."}, {"type": "claims", "items": [{"t": "Числовые пороги успеха без наблюдения за заданиями и без согласия клиента не ста  с материалом не той конфигурации или с неодобренным утверждением о разнице.", "**Офлайн-пакет нельзя отозвать.** Старые копии остаются на компьютерах. Продукт может показать, какая версия у кого и что в ней, но порядок рассылки новых версий решает клиент (OPS-02, OPS-05).", "Все точки потерь пока вводные клиента или гипотезы. Ни одного врача и представителя мы не спрашивали; аналитики в офлайн-пакете нет. Первым проверять на людях: реальна ли путаница при смене ручки и открывают ли врачи материал сами после сессии."], "confirmed": null, "skip": null, "status": "review", "skillReady": true, "todo": [{"kind": "review", "t": "Прочитать и подтвердить этап"}, {"kind": "question", "t": "Путаются ли врачи при переходе со слайдера на кнопку и в чём именно? (PHY-05, REP-03)"}, {"kind": "question", "t": "Открывают ли врачи материал сами после сессии, на каком устройстве и где? (PHY-09, PHY-10)"}, {"kind": "question", "t": "Какие клипы новой ручки сняты и одобрены сейчас, какие пары можно сравнивать? (SCOPE-08, MED-05, MED-06)"}, {"kind": "question", "t": "Как рассылают пакеты и что делают со старыми копиями? (OPS-02, OPS-05)"}, {"kind": "question", "t": "Нужна ли регуляторная проверка обучения перед Publish, раз отдельного согласования нет? (CR-03, MED-08)"}, {"kind": "decision", "t": "Утвердить три метрики: понимание конфигурации и разницы ручек, время от правки до Sent, ноль ошибок применимости"}, {"kind": "decision", "t": "Добавлять ли в Packages поле «причина новой версии» для защитной метрики"}, {"kind": "decision", "t": "Аналитика в офлайн-пакете: не делаем совсем или обсуждаем с клиентом"}], "filled": 8, "total": 8}, {"id": "users", "n": "05", "part": "Смысл", "title": "Роли и сегменты", "skill": "users-segments", "q": "Для кого мы проектируем в первую очередь и почему?", "needs": [{"id": "problem", "title": "Проблема и решение"}], "outputs": [{"key": "roles", "title": "Роли", "hint": "Роль, задача и действия, в периметре или нет. Выбранная роль с обоснованием.", "blo  сегмента из этапа 05 (врач переходит со слайдера на кнопку Tiger 13 и готовится к первому случаю), по сценарию бенчмарка 07 и сценариям F01–F03 (`docs/tigertriever/design/ux-flows-v0.1.md`), а не по экранам."}, {"type": "sub", "t": "Путь врача и представителя"}, {"type": "table", "head": ["Фаза", "Кто", "Что происходит", "Работы"], "rows": [["1. Выбрать конфигурацию", "Врач, представитель", "Пакет открыт; рынок, модель и ручка выбраны или пропущены, если в пакете одна конфигурация; обзор программы", "P01, R03"], ["2. Сессия с представителем", "Представитель ведёт, врач смотрит", "Этапы по порядку, пауза и повтор на вопросах, возврат к прошлому этапу", "P04, R01"], ["3. Самостоятельно перед случаем", "Врач один", "Вечером перед первым случаем врач открывает один этап и пересматривает клип", "P03, P06, Э-01"], ["4. Сравнить ручки", "Врач, представитель", "Что иначе у новой ручки на том же этапе; обе ручки рядом", "P02, R02, P09, С-01"], ["5. Вернуться после", "Врач, представитель", "Через дни или недели врач снова открывает пакет; представитель даёт доступ к нужному разделу", "P08, R04, P07"]]}, {"type": "sub", "t": "Путь редактора"}, {"type": "table", "head": ["Фаза", "Кто", "Что происходит", "Работы"], "rows": [["6. Обновить материал", "Редактор", "Пришло новое видео или текст; новая модель, ручка или рынок", "E01, E05"], ["7. Проверить влияние", "Редактор", "Где ещё используется материал, что изменилось против последнего пакета", "E03"], ["8. Выпустить пакет", "Редактор", "Проверки, сборка, скачивание, отметка «отправлен»; исправление уже розданного", "E04, E06"]]}, {"type": "sub", "t": "Сквозные работы"}, {"type": "list", "items": ["**P05. Доверять, что материал про мою конфигурацию.** Идёт через все фазы врача и представителя. Своей функции у неё нет, она проверяет каждый экран: видно ли, какая модель, ручка, рынок и выпуск.", "**E02. Не распространить инструкцию туда, где она не одобрена.** Идёт через все фазы редактора: любая правка общего урока или медиа спрашивает, где применить.", "**R03. Работать без сети.** Начинается в фазе 1, но ломает любую фазу, если пакет не открылся на машине больницы. Проверяется спайком S0, не экраном."]}, {"type": "sub", "t": "Точки потерь этапа 04 → работы"}, {"type": "table", "head": ["Точка потерь (этап 04)", "Работы", "Чем закрываем (функции ниже)"], "rows": [["1. Материал не той конфигурации или рынка", "P05, P01", "С.1, 1.2, С.4"], ["2. Смена ручки: слайдер → кнопка", "P02, R02, Э-01", "4.1, 4.2, 4.3"], ["3. Нет клипов новой ручки", "P02, P05, E01", "С.2, 4.4, 6.2, 8.2"], ["4. Представителя нет рядом", "P03, P08, R04", "3.1, 3.2, 5.1"], ["5. Устаревшие файлы на компьютерах", "E06, R03", "С.4, 8.4, 8.6 (отзыва нет, только видимость версии)"], ["6. Ограничения офлайна в больницах", "R03, P08", "1.5 (проверяется спайком S0, не экраном)"], ["7. Правка без видимости последствий", "E01, E02, E03", "С.5, 7.1, 7.2"]]}, {"type": "claims", "items": [{"t": "Аудитория: врачи. Используют и с представителем, и самостоятельно; на экране короткий текст рядом с клипом без озвучки.", "label": "input", "level": 2, "src": "Черновик клиента v0.10, июль 2026, стр. 1–2 (пересказ: context-of-use.md, раздел 3)"}, {"t": "Фазы 1–5 совпадают с шагами сценария бенчмарка, где их уже сопоставили с работами P01–P05, P08, R01, R03.", "label": "inference", "level": 2, "src": "docs/research/stages/benchmark.json → scenarios"}, {"t": "Кто управляет экраном в сессии и на каком устройстве, не наблюдали. Фаза 2 описана по словам клиента, а не по наблюдению.", "label": "limit", "level": 1, "src": "jtbd-map-v0.1.md, R01; context-of-use.md, вопрос 8"}]}], "state": "filled"}, {"key": "jobs", "title": "Список работ", "hint": "«Когда …, я хочу …, чтобы …» по стадиям; социальные и эмоциональные — жирным.", "blocks": [{"type": "text", "t": "Работы перенесены из карты JTBD v0.1 с теми же кодами (P врач, R представитель, E редактор). Две работы с кодами Э-01 и С-01 новые: это эмоциональная и социальная гипотезы, которые карта сама называет и просит проверять, а не утверждать. **Жирным** выделены социальные и эмоциональные работы. Приоритет P0 в карте значит «поддержать в первом прототипе», а не измеренную частоту."}, {"type": "table", "head": ["Код", "Фаза", "Кто", "Работа", "Тип", "Основание", "Уровень", "Приоритет"], "rows": [["P01", "1. Выбрать конфигурацию", "Врач", "Когда я согласился освоить конфигурацию Tigertriever, с которой ещё не работал, я хочу понять устройство, его органы управления и порядок обучения, чтобы прийти на практическое обучение, зная, что мне покажут.", "Функциональная", "C1, R1, R3", {"level": 2}, "P0"], ["R03", "1. Выбрать конфигурацию", "Представитель", "Когда я готовлю сессию там, где интернет ненадёжен, я хочу взять с собой рабочую актуальную версию для этой аудитории, чтобы сессия не сорвалась и не шла по устаревшему материалу.", "Функциональная", "C1, T1", {"level": 2}, "P0"], ["P04", "2. Сессия с представителем", "Врач", "Когда представитель ведёт сессию, я хочу идти в удобном темпе и возвращаться к непонятному, чтобы участвовать, а не смотреть сплошную презентацию.", "Функциональная", "C1, R1, D1", {"level": 2}, "P0"], ["R01", "2. Сессия с представителем", "Представитель", "**Когда я показываю конфигурацию врачу или группе, я хочу вести надёжную последовательность и при этом подстраиваться под разговор, чтобы обучение оставалось в рамках одобренного материала и опыта аудитории.**", "Социальная", "C1, D1", {"level": 2}, "P0"], ["P03", "3. Самостоятельно перед случаем", "Врач", "Когда мне нужно освежить один уже показанный этап, я хочу сразу попасть к нему и к его клипу, не проигрывая всё, чтобы быстро вспомнить нужную часть.", "Функциональная", "C1, R2, D1", {"level": 2}, "P0"], ["P06", "3. Самостоятельно перед случаем", "Врач", "Когда во время обучения мне непонятен термин или деталь устройства, я хочу связать одобренное название и вид детали с инструкцией, чтобы понять объяснение, не уходя из урока.", "Функциональная", "C2, O1, R2", {"level": 1}, "P1"], ["Э-01", "3. Самостоятельно перед случаем", "Врач", "**Когда я впервые беру новую ручку в работу, я хочу быть спокоен, что знаю, что в ней иначе, чтобы без тревоги идти в первый случай.**", "Эмоциональная", "Карта, раздел 5: «feel reassured», проверять, не утверждать", {"level": 1}, "Проверить"], ["P02", "4. Сравнить ручки", "Врач", "Когда я знаю одну версию Tigertriever и встречаю одобренную другую, я хочу отделить то, что действительно изменилось в работе с ручкой, от знакомого, чтобы не перенести старые ожидания на новую.", "Функциональная", "C1, C2, R3", {"level": 2}, "P0"], ["R02", "4. Сравнить ручки", "Представитель", "**Когда врач спрашивает, что изменилось между версиями, я хочу открыть нужный одобренный материал сравнения, чтобы объяснить разницу одинаково и не обещать лишнего.**", "Социальная", "C1, C2, P1", {"level": 2}, "P0"], ["P09", "4. Сравнить ручки", "Врач", "Когда я специально изучаю разницу двух доступных моделей, я хочу видеть одобренные характеристики в одной структуре, чтобы понять заявленные различия без рекомендации по лечению.", "Функциональная", "C2, P1, R5; прямого запроса клиента нет", {"level": 1}, "P1"], ["С-01", "4. Сравнить ручки", "Врач", "**Когда я обсуждаю новую ручку с коллегами или представителем, я хочу говорить о ней уверенно, чтобы не выглядеть неподготовленным.**", "Социальная", "Карта, раздел 5: «appear confident before colleagues», проверять осторожно", {"level": 1}, "Проверить"], ["P08", "5. Вернуться после", "Врач", "Когда я хочу вернуться к показу без представителя, я хочу открыть тот же одобренный курс на доступном устройстве, чтобы учиться дальше без повтора урока.", "Функциональная", "C1, D1, T1", {"level": 2}, "P0"], ["R04", "5. Вернуться после", "Представитель", "Когда врач после показа просит вернуться к пункту, я хочу дать ему доступ к нужному одобренному разделу или пакету, чтобы он повторял сам, а я не собирал объяснение заново.", "Функциональная", "C1, D1; поведения не видели", {"level": 1}, "P1"], ["P07", "5. Вернуться после", "Врач", "Когда мне нужен источник к утверждению или характеристике из обучения, я хочу найти ссылку с контекстом и статусом, чтобы не принять исследование за инструкцию.", "Функциональная", "C2, P1, D1", {"level": 1}, "P1"], ["P05", "Сквозная (врач)", "Врач", "**Когда мне показывают руководство, которое бывает в нескольких версиях по рынку и устройству, я хочу проверить, про какое устройство, ручку, рынок и выпуск оно, чтобы не опираться на чужой материал.**", "Эмоциональная", "C2, P1, R4", {"level": 2}, "P0"], ["E01", "6. Обновить материал", "Редактор", "Когда приходит новое видео или текст, я хочу найти нужный урок и обновить черновик, видя все затронутые конфигурации, чтобы случайно не изменить чужое обучение.", "Функциональная", "C2, O2, D1; статусы съёмки в черновике клиента", {"level": 2}, "P0"], ["E05", "6. Обновить материал", "Редактор", "Когда Rapid Medical выводит новую ручку, модель или рынок, я хочу расширить каталог и прикрепить готовые и новые уроки, чтобы не пересобирать интерфейс и не копировать программы целиком.", "Функциональная", "C1, C2, P1; вайрфрейм: Tiger 13/17, затем 21/25", {"level": 2}, "P1"], ["E03", "7. Проверить влияние", "Редактор", "Когда черновик готов, я хочу сравнить его с тем, что реально ушло в последнем пакете, чтобы опубликовать именно нужные изменения и видеть, что поменялось.", "Функциональная", "C2, O2, D1; формулировка без шага одобрения (ADR-006)", {"level": 1}, "P0"], ["E04", "8. Выпустить пакет", "Редактор", "Когда пакет готов к раздаче, я хочу проверить обязательные материалы и точный рынок, чтобы выдать самодостаточный пакет с номером версии, который совпадает с предпросмотром.", "Функциональная", "C2, T1, P1; клиент просит офлайн-версию", {"level": 2}, "P0"], ["E06", "8. Выпустить пакет", "Редактор", "Когда опубликованный источник отозван или исправлен, я хочу знать, какие офлайн-пакеты его содержат и как их можно обновить, чтобы ограничить использование устаревших копий.", "Функциональная", "C2, T1, D1;  типу сходства, вывод и почему аналог может не перенестись.", "blocks": [{"type": "text", "t": "Типы сходства выбраны по работам, а не по категории: руки заняты и взгляд на процессе, один процесс в двух вариантах, вернуться к одному шагу, показать другому человеку."}, {"type": "table", "head": ["Тип сходства", "Где", "Что подсказывает", "Почему может не перенестись"], "rows": [["Руки заняты, шаг читают на ходу", "HelloFresh, Recime, Apple News", "Один шаг на экран, крупная кнопка дальше, текущий шаг выделен", "Рецепт короткий и без видео; врач смотрит не у стола, а до случая"], ["Повторить движение за видео", "Future, Centr, Nike Training Club", "Видео главное, управление в шторке, перемотка на 10 секунд", "Тренировка идёт по таймеру и с музыкой; у нас темп задаёт человек"], ["Одна инструкция в двух вариантах", "Cal AI, Cash App, WHOOP, Incision", "Переключатель перерисовывает тот же шаг; оба варианта в одном шаге", "Наши варианты отличаются клинически; после переключения метка ручки должна быть крупной"], ["Вернуться к нужному месту", "Codecademy, Adobe Learn, Thrombectomy EVT", "Список с длительностью и отметкой «смотрел», полоса этапов всегда видна", "Курс подталкивает к прогрессу и тестам; у нас обучение не проверяется"], ["Точно показать деталь", "iFixit", "Цветные метки на кадре совпадают с пунктами", "Метки рисует автор; у нас их может дать только клиент"]]}, {"type": "claims", "items": [{"t": "Перенос из готовки и тренировок — гипотеза: у этих продуктов нет клинического риска ошибки варианта.", "label": "limit", "level": 2, "src": "Mobbin, 2026-11-08"}, {"t": "Самый полезный аналог для нашей ручки — переключатель варианта в бытовых инструкциях, а не медицинские приложения: в медицинских такого не нашли.", "label": "inference", "level": 2, "src": "Матрица этого этапа"}]}], "state": "filled"}, {"key": "nobody", "title": "Чего нет ни у кого", "hint": "Работы, которые никто не закрывает. «Не нашли» отделять от «нет».", "blocks": [{"type": "claims", "items": [{"t": "Сравнение одного шага у двух вариантов устройства с видео рядом. Проверили 10 продуктов матрицы: нет.", "label": "inference", "level": 2, "src": "Матрица этого этапа"}, {"t": "Режим показа для представителя, который ведёт сессию на чужом экране. Не нашли; Thrombectomy EVT даёт только A−/A+.", "label": "inference", "level": 2, "src": "App Store, Mobbin"}, {"t": "Переключение варианта устройства внутри медицинского обучения. В медицине не нашли, есть только у Incision для стороны операции.", "label": "inference", "level": 2, "src": "App Store"}, {"t": "Явная пометка «этот текст одинаков для обеих ручек». Не нашли; у WHOOP варианты просто перечислены в одном шаге.", "label": "inference", "level": 2, "src": "Mobbin"}, {"t": "«Не нашли» не значит «нет»: просмотр по экранам вендора, внутрь закрытых академий (Medtronic, Stryker, Boston Scientific) не заходили.", "label": "limit", "level": 2, "src": "platform-research-full.md, 2.16"}]}], "state": "filled"}, {"key": "patterns", "title": "Паттерны", "hint": "По фазам: у кого, что делает, что берём и, важнее, что не берём.", "blocks": [{"type": "table", "head": ["Фаза", "У кого", "Что делает", "Берём", "Не берём"], "filter": [{"col": 0, "label": "Фаза", "kind": "chips"}], "rows": [["Выбор", "Incision", "Чип варианта над содержимым", "Чип «Tiger 13 · Precision knob · Europe ▾» в шапке этапа вместо крошек", "Ленту обновлений и соцфункции"], ["Выбор", "Thrombectomy EVT", "Одна программа, выбора нет", "Пропускать выбор, если в пакете одна конфигурация (уже в спеке)", "—"], ["Шаг", "Touch Surgery", "Счётчик n/N, медиа больше половины экрана, текст в шторке", "Экран этапа как плеер: медиа сверху крупно, текст рядом без прокрутки", "3D-симуляции и библиотеку из 300 процедур"], ["Шаг", "HelloFresh", "Фото сверху, номер шага, пункты под ним", "Пункты сразу под видео на телефоне", "Таймеры"], ["Шаг", "iFixit", "Цветные метки на кадре совпадают с пунктами", "Как возможность контента, если клиент даст размеченные кадры", "Длинную страницу всех шагов и магазин"], ["Шаг", "Thrombectomy EVT", "Цветные блоки предупреждений с источником", "Один тип блока, только если клиент захочет предупреждения", "Плотные чек-листы и калькуляторы"], ["Сессия", "Recime, Future", "Один шаг на экран, крупная кнопка Next, полноэкранное видео", "Режим показа для представителя: на весь экран, стрелки клавиатуры, крупный текст", "Музыку, таймер тренировки"], ["Сессия", "Thrombectomy EVT", "A−/A+ в шапке", "Крупный текст в режиме показа", "Секундомер"], ["Вариант", "Cal AI, Cash App", "Сегментный переключатель перерисовывает инструкцию", "Переключатель ручки на том же этапе, метка ручки крупно", "Переключение без явной смены метки"], ["Вариант", "WHOOP", "Оба варианта в одном шаге", "«Показать обе ручки рядом» как продолжение переключателя", "—"], ["Возврат", "Codecademy", "Список с длительностью и отметкой «смотрел», Next item", "Длительность клипа и отметку «смотрел» в полосе этапов, продолжить с места", "Процент прогресса, тесты, геймификацию"], ["Возврат", "Thrombectomy EVT", "Полоса этапов всегда видна", "Полоса этапов — единственная навигация по этапам; поиск убрать", "Десять иконок без подписей"], ["Библиотека", "Philips IGT", "Видео с длительностью «~3 min», документы отдельно", "Длительность у каждого клипа", "Поиск-первым для десяти разделов"]]}, {"type": "text", "t": "Источники: App Store (2026-11-08), Mobbin (2026-11-08), страница iFixit (2026-11-08), прототип v0.3 (замер 2026-11-08), прошлое исследование `docs/tigertriever/research/platform-research-full.md` и `design/mobbin-flow-audit-v0.2.md`."}], "state": "filled"}], "card": {"why": "Посмотреть, как те же работы закрыты у других, и решить, что берём, а что нет.", "input": ["JTBD и конкуренты"], "steps": ["Написать сценарий из фаз JTBD", "Заполнить матрицу продукты × шаги", "Собрать пути экран за экраном", "Разобрать аналоги из других областей", "Выписать, чего нет ни у кого", "Разложить паттерны по фазам"], "rules": ["Шаги берём из работ пользователя, а не из наших экранов", "Сравниваем всех на одном типичном пути", "Заранее пишем, что засчитывается, а что нет", "«Не нашли» отделяем от «нет»", "Подписи к экранам только по самому экрану", "Аналоги ищем по типу сходства, а не по категории продукта", "Для паттерна пишем, что берём и что не берём; второе важнее", "Отмечаем, что проверено руками, а что только по документации"], "tools": ["/benchmark", "Mobbin, Lazyweb, видео, справка вендоров", "пробные аккаунты"], "done": ["Матрица с оценками и основаниями", "Пути с экранами", "Аналоги из других областей", "Чего нет ни у кого", "Паттерны с «не берём»", "Выводы для решения", "Владелец подтвердил этап"]}, "conclusions": ["**Экран этапа сделать плеером, а не страницей.** Медиа крупно сверху, текст рядом и виден без прокрутки, как у Touch Surgery и HelloFresh. Сейчас на ноутбуке видео начинается на 335 px из 900, на телефоне около 560 px из 844, текст на телефоне за краем экрана. Убрать с экрана этапа крошки, плашку-дисклеймер (в подвал) и подписи «Watch» и «Read alongside».", "**Переключать ручку на том же этапе.** Сегментный переключатель «Legacy slider | Precision knob» над видео там, где у модели и рынка две ручки, как у Cal AI и Incision. Отдельная страница Compare остаётся как «показать обе рядом». Сейчас для смены ручки надо уходить в каталог.", "**Режим показа для представителя.** Видео на весь экран, крупный текст, стрелки клавиатуры, минимум кнопок. Такого нет ни у кого из медицинских продуктов в выборке; основа — режим шагов в готовке.", "**Одна навигация по этапам.** Оставить полосу этапов и «назад-вперёд», убрать поиск этапа и крошки: для десяти разделов это дубли. В полосу добавить длительность клипа и отметку «смотрел», при открытии предлагать продолжить с места.", "Всё это уровень L2: экраны и эвристика, без проверки на врачах. Проверять на 3–5 врачах или представителях заданиями «найди этап», «посмотри, что иначе у кнопки», «проведи сессию»."], "confirmed": null, "skip": null, "status": "review", "skillReady": true, "todo": [{"kind": "review", "t": "Прочитать и подтвердить этап"}, {"kind": "decision", "t": "Переделать учебный прототип по выводам: экран-плеер, переключатель ручки, режим показа, одна навигация (v0.4)"}, {"kind": "question", "t": "На чём идёт сессия с представителем: ноутбук врача, проектор, планшет представителя? (встреча с маркетингом, вопрос T8)"}], "filled": 5, "total": 5}, {"id": "principles", "n": "08", "part": "Решения", "title": "Сценарии и принципы", "skill": "design-principles", "q": "Как это должно работать и чего мы сознательно не делаем?", "needs": [{"id": "jtbd", "title": "JTBD, функции и метрики"}, {"id": "benchmark", "title": "Бенчмарк и паттерны"}], "outputs": [{"key": "userflows", "title": "Пользовательские сценарии", "hint": "Прозой, по шагам.", "blocks": [{"type": "text", "t": "Четыре сценария идут от работ этапа 06 и выводов бенчмарка 07. Экраны не раскладываем: описано, что делает человек, что отвечает инструмент, что бывает при сбое, выходе и возврате. Пример конфигурации из сценария бенчмарка: врач годами работал с Tiger 17 со слайдером, больница берёт Tiger 13 с кнопкой."}, {"type": "fold", "t": "1. Врач на первой сессии с представителем (P01, P04, R01, P02, R02)", "blocks": [{"type": "list", "items": ["1. Представитель открывает пакет. Если в пакете одна конфигурация, инструмент сразу показывает обзор программы. Если несколько, спрашивает рынок, затем модель, затем ручку. Ручку спрашивает, только если у модели и рынка есть выбор: у Tiger 13 вне Asia Pacific.", "2. Для Europe + Tiger 13 перед обзором стоит «Before you begin · Anesthesia». Для других конфигураций его нет.", "3. В обзоре видны Opening, восемь этапов с длительностью клипа и Closing. Представитель нажимает Start; Opening показывает анимацию и графики данных для своей группы ручек.", "4. Представитель включает режим показа: клип на весь экран, заголовок и пункты крупно, этапы листаются стрелками. Метка «Tiger 13 · Precision knob · Europe» видна и здесь.", "5. Врач спрашивает про момент в Positioning. Представитель ставит паузу, отматывает, затем стрелкой возвращается к прошлому этапу. Клип сам не стартует, темп задаёт человек.", "6. На Deployment врач спрашивает, что иначе у слайдера. Представитель переключает ручку над видео: этап тот же, метка ручки крупно меняется, пункты по ручке другие. Где клиент пометил «одинаково для всех ручек», так и написано.", "7. **Сбой:** для Precision knob на этом этапе ещё нет видео. Инструмент пишет, что видео для этой ручки ещё нет, кнопки Play нет, кадр слайдера не подставляется. Представитель объясняет словами или идёт дальше.", "8. **Сбой:** пакет не открывается на машине больницы. Это не решается экраном, а проверяется заранее спайком S0 на машинах клиента.", "9. **Выход:** после Closing или в любой момент представитель закрывает пакет. Если хранилище браузера доступно, этапы остаются с отметкой «смотрел»; если нет, следующий запуск начинается с обзора без ошибки."]}]}, {"type": "fold", "t": "2. Врач один вечером перед первым случаем с кнопкой (P03, P08, P02, P05, Э-01)", "blocks": [{"type": "list", "items": ["1. Врач открывает тот же пакет на ноутбуке без сети. Инструмент предлагает продолжить с места или открыть обзор.", "2. Врач идёт сразу на Deployment по полосе этапов: одно-два действия, без поиска и без прохождения с начала. На экране тот же урок, что был на сессии.", "3. Метка в шапке говорит, какая модель, ручка и рынок открыты. **Сбой:** врач понимает, что выбрал не ту ручку; он меняет её на месте и остаётся на том же этапе.", "4. Врач пересматривает клип, ставит паузу на нужном кадре, читает пункты рядом с видео без прокрутки. На телефоне пункты идут сразу под видео.", "5. Хочет увидеть обе ручки одновременно и выбирает «показать обе рядом». Открывается тот же этап у двух ручек, два плеера управляются отдельно, оба стартуют вместе, без синхронизации по времени.", "6. Меняет этап на Retrieval в общем выборе. **Сбой:** у одной стороны нет видео; эта сторона прямо говорит «видео ещё нет», вывода «одинаково» инструмент не делает.", "7. **Возврат:** врач выходит из сравнения и попадает на Deployment с кнопкой, откуда пришёл. Отметки «смотрел» показывают, что он уже видел.", "8. Если хочет понять, из какого выпуска материал, номер пакета виден в одно действие с любого экрана."]}]}, {"type": "fold", "t": "3. Представитель ведёт сессию (R01, R02, R03, R04)", "blocks": [{"type": "list", "items": ["1. **До сессии:** представитель берёт последний пакет у маркетинга и проверяет номер версии и рынок на стартовом экране. Как именно пакет доходит до представителя, пока не известно (OPS-01…03).", "2. Открывает нужную конфигурацию и включает режим показа. Режим меняет только подачу: тот же урок, тот же порядок, крупнее и без лишних кнопок.", "3. По ходу разговора прыгает к этапу, о котором спросили, и возвращается назад. Сессия не ломается от перехода: метка конфигурации и полоса этапов на месте.", "4. На вопрос «что изменилось» переключает ручку на этом же этапе или открывает обе рядом. Показывает только то, что клиент снял и написал; своих выводов инструмент не добавляет.", "5. **Сбой:** вопрос выходит за пределы материала. Инструмент не подсказывает рекомендаций по пациенту или устройству; это остаётся разговором представителя в рамках одобренного.", "6. **После сессии:** врач хочет повторить. Как он получает пакет или раздел, решается отдельно (R04); онлайн-версия и ролик для WhatsApp ждут ответов SCOPE-04 и SCOPE-03.", "7. **Сбой:** у представителя устаревший пакет. Номер версии это показывает, но удалённо обновить уже розданные копии нельзя; нужен новый пакет от маркетинга."]}]}, {"type": "fold", "t": "4. Редактор заменяет общий клип и публикует пакет (E01, E02, E03, E04)", "blocks": [{"type": "list", "items": ["1. Emily сняла крупный план окна-индикатора для Retrieval у Tiger 13 с кнопкой. Редактор входит в общую админку, выбирает Training tool и попадает в What's ready для своего рынка.", "2. В матрице ячейка «Tiger 13 · Precision knob · Retrieval» помечена «Filming needed · Emily». Клик открывает урок в том виде, в каком его увидит врач.", "3. Клик по медиа открывает панель: заменить, исходник съёмки, готовность, где используется. Редактор загружает файл и указывает исходник.", "4. **До замены** инструмент показывает, где ещё используется прежний клип, и спрашивает: «Only this lesson» или «Everywhere it's used (N lessons)». Само ничего не распространяется. Тот же выбор для заголовка и пунктов, помеченных «All handles — same».", "5. Урок получает статус «Unpublished changes». В Changes редактор видит рядом «In package v1.2» и «Your draft», изменённые поля подсвечены, ниже список затронутых конфигураций и пар.", "6. Если нужен взгляд коллеги, редактор отправляет урок ему; коллега оставляет комментарий у места. Отдельного шага согласования нет (ADR-006).", "7. Publish: редактор выбирает состав пакета, инструмент запускает проверки. **Сбой:** «Deployment у Tiger 13 · Precision knob: Filming needed». Блокер стоит у места с действиями «Open stage» и «Leave out of this package».", "8. После исправления: «Publish package v1.3» → Built → Download. Редактор открывает ZIP без сети, проверяет и отмечает Sent. Пакет v1.2 остаётся как был, его копии у врачей не меняются.", "9. **Выход и возврат:** закрыл вкладку посреди правки, черновик сохранён; вернулся, есть Undo и история. Save пакет не меняет."]}]}], "state": "filled"}, {"key": "rejected", "title": "Отвергнуто", "hint": "Механика и причина отказа.", "blocks": [{"type": "text", "t": "Механики, которые напрашиваются и будут возвращаться. У каждой причина и источник, чтобы к закрытому не возвращаться без новых данных."}, {"type": "table", "head": ["Механика", "Почему нет", "Источник"], "rows": [["Тесты, квизы, сертификация, баллы, процент прогресса", "Нет в запросе клиента; инструмент не подтверждает компетенцию и не учит клиническому решению. Бенчмарк 07 берёт у курсов только длительность и «смотрел»", "feature-inventory X-02; learning-and-comparison.md, раздел 7, п. 7; benchmark.json → patterns (Codecademy)"], ["Свободный конструктор страниц для урока", "Урок у клиента фиксированный: заголовок, 3–4 пункта, пункты по ручке, клип. Конструктор добавляет сложность и риск сломать структуру. Правка на месте из ADR-006 меняет текст и медиа, но не оформление", "feature-inventory A-19; mvp-definition-v0.7.md, FS-08; admin-ux-content-workflows.md, раздел 9, S2; client-brief-lesson-content.md"], ["Отдельный шаг согласования, роль согласующего, статусы In review и Approved", "Владелица решила: одобряет сам Publish, взгляд коллеги идёт через комментарии на месте. В админке 3–4 человека", "ADR-006; снимает A-09 и FS-11, часть A-08"], ["Пары сравнения, выведенные автоматически (похожие названия, одна модель)", "Два одобренных урока не дают права сравнивать их между собой. Пара существует, только если её завели вручную", "spec.md → Пара сравнения; screen-map-v0.1.md, Content contract; feature-inventory C-09, A-14"], ["Подстановка видео другой ручки или рынка, когда своего нет", "Создаёт ложное «одинаково». Отсутствие показываем прямо", "mvp-definition FS-05; feature-inventory L-13; mobbin-flow-audit-v0.2.md, F5"], ["Синхронизация двух видео по времени в сравнении", "Одинаковая секунда у двух клипов не значит одинаковое действие; исследований в пользу нет", "learning-and-comparison.md, CX-04"], ["Рекомендации «смотрите также» после клипа", "Темп сессии задаёт представитель или врач; чужие клипы уводят от этапа. Автоплей самого клипа этапа принят (владелица, 2026-11-09)", "mobbin-flow-audit-v0.2.md (MasterClass, не берём); learning-and-comparison.md, Prototype B"], ["Одна длинная страница всех шагов с прокруткой", "Текст уезжает за край, этап теряется. В прототипе v0.3 на телефоне текст за краем экрана", "benchmark.json → scenarios (шаг 2, не засчитываем), patterns (iFixit, не берём)"], ["Рекомендация модели или устройства под пациента, клиническая поддержка решений", "Инструмент обучает работе с выбранной конфигурацией, а не выбирает её. Клинические утверждения за клиентом", "content-taxonomy-ia.md, раздел 7; ux-flows-v0.1.md, Heuristic checks; jtbd-map-v0.1.md, раздел 1"], ["Различия и подписи, сгенерированные AI", "Различия пишет только клиент; сгенерированный клинический текст недопустим", "feature-inventory C-07; mobbin-flow-audit-v0.2.md, Adopt"], ["Онлайн-страница обучения для врача", "Отложено, а не отвергнуто: пока объём не подтверждён, обещать нельзя. Сейчас офлайн-пакет плюс онлайн-админка", "feature-inventory X-03; mvp-definition FS-17; вопрос SCOPE-04"], ["Ролик для WhatsApp как часть приложения", "У клиента это отдельный финальный файл, не урок", "client-brief-lesson-content.md (стр. 13); feature-inventory X-01; SCOPE-03"], ["Отдельные режимы Learn и Quick Reference, режим новичка и эксперта", "Один экран этапа обслуживает порядок и прямой доступ. Отдельный режим только если общий провалится на тестах", "mvp-definition, раздел 4; feature-inventory L-20; jtbd-map-v0.1.md, раздел 4"], ["Поиск этапа и крошки на экране этапа", "Для десяти разделов это дубли полосы этапов; крошки заменяет метка конфигурации", "benchmark.json, выводы и patterns"], ["Вкладки как на сайте: Videos, Specs, Evidence", "Сайт продаёт, инструмент учит; этапы идут первыми, вспомогательное только если клиент даст материал", "content-taxonomy-ia.md, разделы 3 и 7; screen-map-v0.1.md"], ["Озвучка поверх клипов", "Клиент задал клипы без звука с текстом рядом", "client-brief-lesson-content.md; mvp-definition FS-04"], ["Удалённый отзыв уже розданных пакетов", "Офлайн-копию нельзя поменять на чужом компьютере; обещать нельзя", "jtbd-map-v0.1.md, E06; admin-ux-content-workflows.md, 6.1"], ["Пакет, который ссылается на живые данные, а не на снимок", "Правка после сборки тихо поменяла бы то, что ушло врачам", "admin-ux-content-workflows.md, раздел 2 (Strapi, не берём); spec.md → Пакет"], ["Studio, устроенная как таблицы базы или как проекты выпусков", "Редактору трудно понять, что относится к этапу; замена одного клипа становится бюрократией. Берём путь через программу и этап", "admin-ux-content-workflows.md, раздел 8 (варианты A и C)"]]}], "state": "filled"}, {"key": "principles", "title": "Принципы дизайна", "hint": "Тема → основание → правила → принцип.", "blocks": [{"type": "text", "t": "Восемь принципов. Каждый решает спор двух хороших вещей: что выигрывает, когда они сталкиваются. Правила проверяются на любом экране."}, {"type": "table", "head": ["№", "Тема", "Принцип"], "rows": [["1", "Точный контекст всегда виден", "**Точность контекста важнее чистоты экрана.** Метка конфигурации остаётся даже в режиме показа, где убрано всё остальное."], ["2", "Медиа первым, текст рядом", "**Клип и его текст на одном экране важнее полноты текста.** Если не помещается, текст сокращается до заголовка и пунктов клиента, а не уезжает вниз."], ["3", "Честное отсутствие", "**Честная дыра важнее полного вида.** Если материала нет, экран говорит об этом, а не заполняет место похожим."], ["4", "Один урок, один рендер", "**Одна навигация важнее удобных дублей.** Порядок, прямой переход, режим показа и предпросмотр редактора показывают один и тот же урок."], ["5", "Темп задаёт человек", "**Управление у человека важнее плавности просмотра.** Ничего не играет и не листается само."], ["6", "Сравниваем только заведённое", "**Безопасность сравнения важнее его охвата.** Лучше меньше пар, чем одна выведенная."], ["7", "Редактор видит влияние до правки", "**Явный выбор важнее скорости правки.** Лишний вопрос «где применить» дешевле, чем тихо изменённый урок другой конфигурации."], ["8", "Пакет заморожен", "**Неизменность выпущенного важнее свежести.** Исправление уходит новым пакетом, а не правкой старого."]]}, {"type": "fold", "t": "1. Точный контекст всегда виден", "blocks": [{"type": "text", "t": "**Точность контекста важнее чистоты экрана.** Метка конфигурации остаётся даже в режиме показа, где убрано всё остальное."}, {"type": "text", "t": "**Основание.** Работа P05 и FS-02: врач не должен опираться на материал не своей модели, ручки или рынка. Бенчмарк 07: метка-чип над содержимым вместо крошек. У одной модели две ручки и разные данные по рынкам (черновик клиента)."}, {"type": "list", "items": ["На экране этапа, в сравнении и в режиме показа видны модель, ручка и рынок.", "В сравнении у каждой стороны своя метка, и она не уезжает при прокрутке.", "Смена ручки заметно меняет метку на том же месте.", "Номер пакета доступен с любого экрана в одно действие.", "Крошек на экране этапа нет: их работу делает метка."]}]}, {"type": "fold", "t": "2. Медиа первым, текст рядом", "blocks": [{"type": "text", "t": "**Клип и его текст на одном экране важнее полноты текста.** Если не помещается, текст сокращается до заголовка и пунктов клиента, а не уезжает вниз."}, {"type": "text", "t": "**Основание.** Черновик клиента: заголовок и 3–4 пункта рядом с немым клипом. Пространственная смежность (learning-and-comparison, LE-04). Замер прототипа v0.3: на ноутбуке видео начинается на 335 px из 900, на телефоне текст за краем."}, {"type": "list", "items": ["На ноутбуке 1280×800 медиа и пункты видны без прокрутки.", "На телефоне 390 px пункты идут сразу под видео, заголовок над ним.", "Пауза, повтор и перемотка видны всегда, работают с клавиатуры.", "Дисклеймер и служебные подписи в подвале, не на экране этапа."]}]}, {"type": "fold", "t": "3. Честное отсутствие", "blocks": [{"type": "text", "t": "**Честная дыра важнее полного вида.** Если материала нет, экран говорит об этом, а не заполняет место похожим."}, {"type": "text", "t": "**Основание.** FS-05 и L-13: не подставлять и не подразумевать равенство. Аудит Mobbin v0.2 нашёл фальшивый Play у отсутствующего видео. Принцип воркспейса «никаких обманок в UI»."}, {"type": "list", "items": ["Нет медиа: текст «видео для этой ручки ещё нет», кнопки Play нет.", "Медиа другой ручки или рынка никогда не подставляется.", "Если пары нет, переключатель ручки и сравнение не показаны или недоступны с причиной.", "«Одинаково для всех ручек» пишется только там, где так по
